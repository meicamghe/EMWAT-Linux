name: Analyze EMWAT Word event sink
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-word-event-sink.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/find_td32_class_procedures.py'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/trace_pe_range.py'
      - 'tools/trace_delphi_interfaces.py'
      - 'tools/resolve_delphi_vmt_slots.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/scan_named_pe_resource.py'
permissions:
  contents: read
jobs:
  event-sink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Find Word automation and OLE event classes
        run: |
          mkdir -p event-sink-analysis/classes
          python tools/find_td32_class_procedures.py analysis-input/EmwatMethods.bpl1 TWordApplication TOleServer TWordApplicationEvents TWordApplicationEventsSink TWordAppEvents TWordDocument TWordViwer > event-sink-analysis/classes/word-automation-class-procedures.md
          python - <<'PY'
          import pathlib, re, subprocess, sys
          source = pathlib.Path("event-sink-analysis/classes/word-automation-class-procedures.md").read_text(encoding="utf-8")
          terms = re.compile(r"before(save|close)|documentbefore|connect|disconnect|invokeevent|initserverdata|defaultinterface|event", re.I)
          rows = []
          for line in source.splitlines():
              parts = [part.strip() for part in line.split("|")]
              if len(parts) < 4:
                  continue
              module, decorated, target = parts[1], parts[2].strip(chr(96)), parts[3]
              match = re.search(r"0x([0-9A-Fa-f]{8})", target)
              if match and terms.search(decorated):
                  rows.append((module, decorated, match.group(1)))
          outdir = pathlib.Path("event-sink-analysis/classes/traces")
          outdir.mkdir(parents=True, exist_ok=True)
          summary = ["# Selected Word automation event method traces", ""]
          seen = set()
          for module, decorated, va in rows:
              if va in seen:
                  continue
              seen.add(va)
              safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", decorated)[:100]
              output = outdir / f"{va}-{safe}.md"
              subprocess.run([sys.executable, "tools/trace_td32_procedure.py", "analysis-input/EmwatMethods.bpl1", "0x" + va, str(output)], check=True)
              summary.append(f"- {module} — 0x{va} — {decorated} — {output}")
          pathlib.Path("event-sink-analysis/classes/trace-index.md").write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY
      - name: Trace event callback record assignments and handlers
        run: |
          mkdir -p event-sink-analysis/callbacks
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B8C60 0x004B8D10 event-sink-analysis/callbacks/OnTmrAutoSave-event-record-assignments.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004CD154 0x004CD364 event-sink-analysis/callbacks/BeforeSave-event-body.md
          for target in 004CD154 004CCBBC 004CD54C 004CD9C0 004CE030 004D00AC; do
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/callbacks/$target-callers.md
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/callbacks/$target-pointer-refs.md
          done
      - name: Resolve Word COM interface and VMT event metadata
        run: |
          mkdir -p event-sink-analysis/interfaces
          python tools/trace_delphi_interfaces.py analysis-input/EmwatMethods.bpl1 event-sink-analysis/interfaces/word-com-interfaces.md
          python tools/resolve_delphi_vmt_slots.py analysis-input/EmwatMethods.bpl1 event-sink-analysis/interfaces/word-vmt-slots.md
          python tools/scan_named_pe_resource.py analysis-input/EmwatMethods.bpl1 TWORDAPPLICATION event-sink-analysis/interfaces/TWORDAPPLICATION-resources.md
          python tools/scan_named_pe_resource.py analysis-input/EmwatMethods.bpl1 TWORDAPPLICATIONEVENTS event-sink-analysis/interfaces/TWORDAPPLICATIONEVENTS-resources.md
      - name: Trace generated Word server metadata and event dispatch
        run: |
          mkdir -p event-sink-analysis/server-metadata
          for target in 0043E070 0043E0F0 0043E0FC 0043E174 0043E270 0042ABF8 00404F8C 00404FAC 00401188 00401198 00401430; do
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/server-metadata/procedure-$target.md
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/server-metadata/callers-$target.md
          done
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x0043E070 0x0043E174 event-sink-analysis/server-metadata/TWordApplication-init-connect-range.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00627A38 --before 0x10 --after 0x90 > event-sink-analysis/server-metadata/data-627A38.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00627B74 --before 0x10 --after 0x90 > event-sink-analysis/server-metadata/data-627B74.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x00627A38 0x00627B74 > event-sink-analysis/server-metadata/server-data-strings.md
          python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x00627A38 event-sink-analysis/server-metadata/data-627A38-pointer-refs.md
          python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x00627B74 event-sink-analysis/server-metadata/data-627B74-pointer-refs.md
      - name: Trace generated Word event callback table targets
        run: |
          mkdir -p event-sink-analysis/event-handlers
          python - <<'PY'
          import pathlib, re, subprocess, sys
          source = pathlib.Path("event-sink-analysis/server-metadata/data-627B74.md").read_text(encoding="utf-8")
          targets = sorted(set(re.findall(r"0x(0044[0-9A-Fa-f]{4})", source)))
          index = ["# Generated Word event callback target traces", ""]
          for target in targets:
              output = f"event-sink-analysis/event-handlers/{target}.md"
              callers = f"event-sink-analysis/event-handlers/{target}-callers.md"
              subprocess.run([sys.executable, "tools/trace_td32_procedure.py", "analysis-input/EmwatMethods.bpl1", "0x" + target, output], check=True)
              subprocess.run([sys.executable, "tools/trace_td32_callers.py", "analysis-input/EmwatMethods.bpl1", "0x" + target, callers], check=True)
              index.append(f"- 0x{target}: {output}; callers: {callers}")
          pathlib.Path("event-sink-analysis/event-handlers/index.md").write_text("\n".join(index) + "\n", encoding="utf-8")
          PY
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00404F8C event-sink-analysis/event-handlers/InvokeEvent-dispatch-helper.md 180 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00401188 event-sink-analysis/event-handlers/InvokeEvent-callback-helper.md 180 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00404FAC event-sink-analysis/event-handlers/ConnectTo-helper.md 220 ret
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-word-event-sink-analysis
          path: event-sink-analysis/
