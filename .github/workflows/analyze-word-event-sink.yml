name: Analyze EMWAT Word event sink
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-word-event-sink.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/find_td32_class_procedures.py'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_pe_target.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/trace_pe_range.py'
      - 'tools/trace_delphi_interfaces.py'
      - 'tools/resolve_delphi_vmt_slots.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/scan_td32_class_field_refs.py'
      - 'tools/scan_named_pe_resource.py'
permissions:
  contents: read
jobs:
  event-sink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Find Word automation and OLE event classes
        run: |
          mkdir -p event-sink-analysis/classes
          python tools/find_td32_class_procedures.py analysis-input/EmwatMethods.bpl1 TWordApplication TOleServer TWordApplicationEvents TWordApplicationEventsSink TWordAppEvents TWordDocument TWordViwer > event-sink-analysis/classes/word-automation-class-procedures.md
          python - <<'PY'
          import pathlib, re, subprocess, sys
          source = pathlib.Path("event-sink-analysis/classes/word-automation-class-procedures.md").read_text(encoding="utf-8")
          terms = re.compile(r"before(save|close)|documentbefore|connect|disconnect|invokeevent|initserverdata|defaultinterface|event", re.I)
          rows = []
          for line in source.splitlines():
              parts = [part.strip() for part in line.split("|")]
              if len(parts) < 4:
                  continue
              module, decorated, target = parts[1], parts[2].strip(chr(96)), parts[3]
              match = re.search(r"0x([0-9A-Fa-f]{8})", target)
              if match and terms.search(decorated):
                  rows.append((module, decorated, match.group(1)))
          outdir = pathlib.Path("event-sink-analysis/classes/traces")
          outdir.mkdir(parents=True, exist_ok=True)
          summary = ["# Selected Word automation event method traces", ""]
          seen = set()
          for module, decorated, va in rows:
              if va in seen:
                  continue
              seen.add(va)
              safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", decorated)[:100]
              output = outdir / f"{va}-{safe}.md"
              subprocess.run([sys.executable, "tools/trace_td32_procedure.py", "analysis-input/EmwatMethods.bpl1", "0x" + va, str(output)], check=True)
              summary.append(f"- {module} — 0x{va} — {decorated} — {output}")
          pathlib.Path("event-sink-analysis/classes/trace-index.md").write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY
      - name: Trace event callback record assignments and handlers
        run: |
          mkdir -p event-sink-analysis/callbacks
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B8C60 0x004B8D10 event-sink-analysis/callbacks/OnTmrAutoSave-event-record-assignments.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004CD154 0x004CD364 event-sink-analysis/callbacks/BeforeSave-event-body.md
          for target in 004CD154 004CCBBC 004CD54C 004CD9C0 004CE030 004D00AC; do
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/callbacks/$target-callers.md
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/callbacks/$target-pointer-refs.md
          done
      - name: Exhaustively scan viewer state and trace COM event dispatch
        shell: bash
        run: |
          mkdir -p event-sink-analysis/state-fields event-sink-analysis/dispatch-helpers
          python tools/scan_td32_class_field_refs.py analysis-input/EmwatMethods.bpl1 TWordViwer event-sink-analysis/state-fields/TWordViwer-offset-58.md --offsets 0x54 0x58 0x5E 0x5F 0x79 0x7C 0x80 0x88 0xA0
          python tools/scan_td32_class_field_refs.py analysis-input/EmwatMethods.bpl1 TWordApplication event-sink-analysis/state-fields/TWordApplication-event-fields.md --offsets 0x80 0x84 0x88 0x8C 0x90 0x94 0x98 0x9C 0x124
          for target in 00404F8C 00401188 00404FAC 00404FBC 00440950 0040479C 00401358 00401370 00401210 00401430; do
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/dispatch-helpers/target-$target.md 1200 ret
          done
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00429128 --before 0x80 --after 0x300 > event-sink-analysis/dispatch-helpers/TWordApplication-typeinfo.md
          for target in 004C5E04 004565DC 004563A8 00403520 00403430 0042BD34 0042BD94 0042ABA0; do
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/state-fields/procedure-$target.md
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/state-fields/callers-$target.md
          done
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004565DC event-sink-analysis/dispatch-helpers/target-004565DC.md 1400 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004563A8 event-sink-analysis/dispatch-helpers/target-004563A8.md 1400 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00403520 event-sink-analysis/dispatch-helpers/target-00403520.md 1400 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00403430 event-sink-analysis/dispatch-helpers/target-00403430.md 1400 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00401240 event-sink-analysis/dispatch-helpers/target-00401240.md 1400 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0042BD34 event-sink-analysis/dispatch-helpers/target-0042BD34.md 1400 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0042BD94 event-sink-analysis/dispatch-helpers/target-0042BD94.md 1400 ret
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004BA84C --before 0x40 --after 0x120 > event-sink-analysis/dispatch-helpers/OnTmrAutoSave-constant-4BA84C.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CD928 --before 0x40 --after 0x120 > event-sink-analysis/dispatch-helpers/BeforeSave-constant-4CD928.md
      - name: Resolve Word COM interface and VMT event metadata
        run: |
          mkdir -p event-sink-analysis/interfaces
          python tools/trace_delphi_interfaces.py analysis-input/EmwatMethods.bpl1 event-sink-analysis/interfaces/word-com-interfaces.md
          python tools/resolve_delphi_vmt_slots.py analysis-input/EmwatMethods.bpl1 event-sink-analysis/interfaces/word-vmt-slots.md
          python tools/scan_named_pe_resource.py analysis-input/EmwatMethods.bpl1 TWORDAPPLICATION event-sink-analysis/interfaces/TWORDAPPLICATION-resources.md
          python tools/scan_named_pe_resource.py analysis-input/EmwatMethods.bpl1 TWORDAPPLICATIONEVENTS event-sink-analysis/interfaces/TWORDAPPLICATIONEVENTS-resources.md
      - name: Trace Word server and event-interface metadata
        run: |
          mkdir -p event-sink-analysis/server-metadata
          for target in 0043E070 0043E0F0 0043E0FC 0043E174 0043E270 0042ABF8 00404F8C 00404FAC 00401188 00401198 00401430 0040479C 00401358 00401210 00401420; do
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/server-metadata/procedure-$target.md
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/server-metadata/callers-$target.md
          done
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x0043E070 0x0043E174 event-sink-analysis/server-metadata/TWordApplication-init-connect-range.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00627B74 --before 0x10 --after 0x220 > event-sink-analysis/server-metadata/event-map-627B74-expanded.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00627768 --before 0x10 --after 0x220 > event-sink-analysis/server-metadata/server-data-627768-expanded.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00627768 --before 0x10 --after 0x90 > event-sink-analysis/server-metadata/data-627768.md
          python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x00627768 event-sink-analysis/server-metadata/data-627768-pointer-refs.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00627A38 --before 0x10 --after 0x220 > event-sink-analysis/server-metadata/server-data-627A38-expanded.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00627A38 --before 0x10 --after 0x90 > event-sink-analysis/server-metadata/data-627A38.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00627B74 --before 0x10 --after 0x90 > event-sink-analysis/server-metadata/data-627B74.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x00627768 0x00627A38 0x00627B74 > event-sink-analysis/server-data-strings.md
          python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x00627A38 event-sink-analysis/server-metadata/data-627A38-pointer-refs.md
          python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x00627B74 event-sink-analysis/server-metadata/data-627B74-pointer-refs.md
          for target in 0040479C 00401358 00401210 00401420 00401230 00401248 00401200 00401430; do
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target event-sink-analysis/server-metadata/pe-target-$target.md 24
          done
      - name: Decode generated Word server error-map strings
        run: |
          mkdir -p event-sink-analysis/server-metadata
          python - <<'PY'
          import pathlib, re, subprocess, sys
          source = pathlib.Path("event-sink-analysis/server-metadata/event-map-627B74-expanded.md").read_text(encoding="utf-8")
          targets = sorted(set(re.findall(r"^0x[0-9A-Fa-f]{8}: (0044[0-9A-Fa-f]{4}) ->", source, re.M)))
          output = pathlib.Path("event-sink-analysis/server-metadata/server-error-map-strings.md")
          subprocess.run(
              [sys.executable, "tools/decode_pe_strings.py", "analysis-input/EmwatMethods.bpl1",
               *("0x" + target for target in targets)],
              check=True,
              stdout=output.open("w", encoding="utf-8"),
          )
          pathlib.Path("event-sink-analysis/server-metadata/server-error-map-index.md").write_text(
              "# Server error-map string pointer index\\n\\n" +
              "\\n".join(f"- 0x{target}" for target in targets) + "\\n",
              encoding="utf-8",
          )
          PY
      - name: Decode generated Word error-map and auto-save interval strings
        shell: bash
        run: |
          mkdir -p event-sink-analysis/error-map-strings
          python - <<'PY'
          import pathlib, re, subprocess, sys
          source = pathlib.Path("event-sink-analysis/server-metadata/event-map-627B74-expanded.md").read_text(encoding="utf-8")
          targets = sorted(set(re.findall(r"^0x[0-9A-Fa-f]{8}: (0044[0-9A-Fa-f]{4}) ->", source, re.M)))
          command = [sys.executable, "tools/decode_pe_strings.py", "analysis-input/EmwatMethods.bpl1"] + ["0x" + target for target in targets]
          with pathlib.Path("event-sink-analysis/error-map-strings/strings.md").open("w", encoding="utf-8") as output:
              subprocess.run(command, check=True, stdout=output, text=True)
          pathlib.Path("event-sink-analysis/error-map-strings/index.md").write_text(
              "# Generated Word event metadata string targets\n\n" + "\n".join(f"- 0x{x}" for x in targets) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Decode native BeforeSave prompt text and button labels
        run: |
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 \
            0x004CD374 0x004CD3C0 0x004CD3DC 0x004CD3F0 \
            0x004CD40C 0x004CD41C 0x004CD42C 0x004CD4BC 0x004CD50C \
            > event-sink-analysis/callbacks/BeforeSave-dialog-strings.md
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-word-event-sink-analysis
          path: event-sink-analysis/
