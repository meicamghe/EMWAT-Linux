          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004D6A98 word-automation/fields/twin-field-map-addorset-callers.md
          python tools/scan_pe_call_refs.py analysis-input/EmwatMethods.bpl1 0x004D1148 word-automation/fields/add-xml-word-config-fields-all-callrefs.md
          python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x004D1148 word-automation/fields/add-xml-word-config-fields-pointer-refs.md || true
          python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x004D1454 word-automation/fields/add-custom-doc-properties-pointer-refs.md || true
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x004B10A4 word-automation/fields/wordviewer-vmt.md || true
