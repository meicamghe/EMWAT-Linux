          python tools/scan_pe_rel32_call_bytes.py analysis-input/EmwatMethods.bpl1 0x004D6310 word-automation/fields/map-twin-dosetvalue-rel32-candidates.md
          python tools/scan_pe_rel32_call_bytes.py analysis-input/EmwatMethods.bpl1 0x004D6360 word-automation/fields/map-twin-update-existing-rel32-candidates.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x004BC170 word-automation/fields/field-config-string-normalizer.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004BC170 word-automation/fields/field-config-string-normalizer-callers.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x004BC23C 0x004BC260 0x004BC274 0x004D0BD0 0x004D0BF0 0x004D0C18 0x004D0C3C 0x004D0C5C 0x004D0C60 0x004D0C70 0x004D0CC8 > word-automation/fields/field-config-and-viewer-constructor-strings.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004D5048 word-automation/fields/field-map-constructor-from-enumerable-callers.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004D5100 word-automation/fields/field-map-constructor-from-enumerable-overload-callers.md
