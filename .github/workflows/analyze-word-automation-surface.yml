    steps:
      - uses: actions/checkout@v4
      - name: Extract authorized EMWAT analysis binaries
        if: hashFiles('EMWAT_Extracted.zip') != ''
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("EMWAT_Extracted.zip")
