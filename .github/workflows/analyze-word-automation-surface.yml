          with ZipFile(archive) as zf:
              found = {Path(name).name: name for name in zf.namelist() if Path(name).name in wanted}
              for basename in sorted(wanted & found.keys()):
                  (out / basename).write_bytes(zf.read(found[basename]))
                  print(f"Extracted {basename}: {(out / basename).stat().st_size} bytes")
          PY
      - name: Report missing analysis input
        if: hashFiles('analysis-input/EmwatMethods.bpl1') == ''
        run: echo "::notice::Skipped binary analysis because analysis-input/EmwatMethods.bpl1 is not present in this checkout."
      - uses: actions/setup-python@v5
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
      - name: Trace save and print side effects
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
        shell: bash
        run: |
          mkdir -p word-automation/save-print
          for address in 0x004C5E04 0x004C5FF8 0x004CB108 0x004CB1B4 0x004CB638 0x004CDC2C 0x004CE030 0x004D23D8; do
            name=${address#0x}
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 "$address" "word-automation/save-print/$name.md" 7000 ret
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 "$address" "word-automation/save-print/$name-td32.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$address" "word-automation/save-print/$name-callers.md" || true
          done
          python tools/find_td32_class_procedures.py analysis-input/EmwatMethods.bpl1 TWordViwer TEmwatMethod TScanDocument > word-automation/save-print/word-class-procedures.md
          python tools/resolve_delphi_vmt_slots.py analysis-input/EmwatMethods.bpl1 word-automation/save-print/word-vmt.md
          python tools/trace_delphi_interfaces.py analysis-input/EmwatMethods.bpl1 word-automation/save-print/word-interfaces.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x004BFEE8 0x004BFF0C 0x004D1704 0x004D1768 0x004D1778 0x004CCB0C 0x004CCB2C 0x004CCB38 0x004CCB44 0x004CCB60 0x004CCB6C 0x004CC280 0x004CC26C 0x004CC6DD 0x004CC6C9 0x004CCB84 0x004CCAA7 0x004CCB45 0x004CCB61 0x004C10A0 0x004C10DC 0x004C1130 0x004C1160 0x004C11C0 0x004C1224 0x004C12A4 0x004C12C4 0x004C1408 0x004C1418 0x004C148C 0x004C14C0 0x004C14D8 0x004C1558 0x004C15E8 0x004C1648 0x004C16AC 0x004C1718 0x004C25C4 0x004C260C 0x004C26B8 0x004C26BC 0x004C26C4 0x004C26E0 0x004C2718 0x004C2730 0x004C27BC 0x004C281C 0x004C2844 0x004C287C 0x004C289C 0x004C28DC 0x004C2958 0x004C29B4 0x004C29F4 0x004C2A50 0x004C2AB4 0x004C2AF0 0x004C2D68 0x004C2D84 0x004C2DA4 0x004C2DC8 > word-automation/save-print/field-and-property-keys.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x004BC6D4 0x004BC710 0x004BC748 0x004BC76C 0x004BC78C 0x004BC7B4 0x004BC7D8 0x004BC7F8 0x004BC804 0x004BC82C 0x004BC8A8 0x004BC910 > word-automation/save-print/image-field-branch-strings.md
      - uses: actions/upload-artifact@v4
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
        with:
          name: emwat-word-save-print
          path: word-automation/save-print/
          if-no-files-found: error
