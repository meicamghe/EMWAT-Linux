          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B15F0 0x004B1660 word-automation/fields/add-xml-word-config-fields-context-4B16.md
          for address in 0x004D4D08 0x004D4D58 0x004D4DA8 0x004D52DC 0x004D54E0 0x004D552C 0x004D559C 0x004D6894 0x004D6A98; do
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 "$address" "word-automation/fields/${address}-method-pointer-refs.md" || true
