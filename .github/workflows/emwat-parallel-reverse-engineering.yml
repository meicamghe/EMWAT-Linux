name: EMWAT parallel reverse-engineering lanes
on:
  push:
    paths:
      - '.github/workflows/emwat-parallel-reverse-engineering.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'analysis-input/RCDATA_TFRMGSCANPREVIEW_13.bin'
      - 'analysis-input/RCDATA_TFRMIMAGETOOLS_14.bin'
      - 'analysis-input/RCDATA_TFRMSIMPLEIMAGEEDITOR_18.bin'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/list_td32_symbols.py'
      - 'tools/resolve_delphi_vmt_slots.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/scan_pe_iat_callers.py'
      - 'tools/decode_pe_strings.py'
      - 'tools/trace_pe_target.py'
      - 'native/**'
      - 'python/**'
      - '.github/workflows/native-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  word-print-com:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace Word print dispatch and callback helpers
        shell: bash
        run: |
          mkdir -p parallel-re/word-print
          targets=(004C5FF8 004309F8 00441E44 00436030 004360F0 004361B0 00445B70 004677B8 00467788 004A5C10 004A5D78 004A5EA8 004D2EC8 004D2F44 00403550 004034E8 00403520 004034D0 00403368 00403480 0042ABA0 004ADA4C 0043EC28 0043EAB8 0043F308 00440B2C 00403488 0043FF40 0043FFA0 004A8F78 004A8FCC 004A8E58 004A90D4 004A9464 004A9884 004A9A08 0047CAF0 0047CC6C 0047CC94 0047D054 0047D238 0047D448)
          pids=()
          for target in "${targets[@]}"; do
            (
              set -e
              python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/word-print/procedure-$target.md
              python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/word-print/callers-$target.md
              python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/word-print/pointers-$target.md
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Decode Delphi Variant runtime helper bodies outside TD32 procedure ranges
        shell: bash
        run: |
          mkdir -p parallel-re/word-print/rtl-helpers
          targets=(00403550 004034E8 00403520 004034D0 00403368 00403480 00401420 00401478)
          pids=()
          for target in "${targets[@]}"; do
            (python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/word-print/rtl-helpers/helper-$target.md 100 ret) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Index Word automation and print-handler symbols
        run: |
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            TWordDocument TWordApplication PrintOut PrintOutOld PrintOut2000 \
            BGPrintWithGamPrintOptions TEmwatDocPrintHandler TEDPController TWordViwer \
            Zanprinter GetPrinterName ActivePrinter TPrinter \
            > parallel-re/word-print/symbol-index.md
      - name: Decode printer selection and installation string constants
        run: |
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 \
            0x0047CC64 0x0047CF90 0x0047CFB8 0x0047CFC4 \
            0x0047CFDC 0x0047CFEC 0x0047D00C 0x0047D02C 0x0047D048 \
            0x0047D3CC 0x0047D3DC 0x0047D3F8 0x0047D408 0x0047D434 \
            0x0047D678 0x0047D688 0x0047D69C 0x0047D6AC 0x0047D6B8 \
            0x0047D6D4 0x0047D6EC 0x0047D704 0x0047D708 0x0047D72C \
            0x0047D740 0x0047D74C 0x0047D764 0x0047D770 0x0047D778 \
            0x0047D790 0x0047D798 0x0047D7B0 0x0047D7B4 0x0047D7C8 \
            0x0047D800 0x0047D828 0x0047D840 0x0047D85C 0x0047D86C \
            0x0047D880 0x0047D8A0 \
            > parallel-re/word-print/printer-string-constants.md
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-parallel-word-print
          path: parallel-re/word-print/
          if-no-files-found: error

  image-ui-and-vmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Resolve image and scanner Delphi VMTs and slots
        run: |
          mkdir -p parallel-re/image-ui
          python tools/resolve_delphi_vmt_slots.py analysis-input/EmwatMethods.bpl1 \
            parallel-re/image-ui/image-scanner-vmt-slots.md
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            TfrmSimpleImageEditor TfrmGScanPreview TfrmImageTools TGearImgProc \
            TImageProcessor TResultImage TMultiPageImage TSetOfMultiPageImages \
            TSetOfSinglePageImages TScanCommand > parallel-re/image-ui/image-scanner-symbols.md
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            TResultImage TSetOfSinglePageImages TSetOfMultiPageImages \
            GetScanPath GetResponseFileName SetResultImage > parallel-re/image-ui/result-container-symbols.md
      - name: Trace scanner, multipage TIFF, and image-editor operations in parallel
        shell: bash
        run: |
          targets=(0061D888 0061DC80 0061D070 0061D100 0061D250 0061D36C 0061CF9C 0061DEF4 0061E3C8 0061E3F0 004EF9CC 0061E470 0061E510 0061E548 0061E5C0 0061E5F0 0061E620 0061E680 004EEE24 004F17B4 004F1064 004F109C 004F11E8 004F1274 004F1308 004F1404 004F1660 004F1890 004F1A04 004F1D04 004EF138 004EF40C 004EF510 004EF714 004EF8C0 004EF9CC 004EEDB4 004F01F0 00508A90 0050A29C 0050A414 0050A534 0050AB2C 0050ABA4 0050ACDC 0050BBB8)
          pids=()
          for target in "${targets[@]}"; do
            (
              set -e
              python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/image-ui/procedure-$target.md
              python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/image-ui/callers-$target.md
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Trace Delphi coordinate conversion and image editor runtime helpers
        shell: bash
        run: |
          mkdir -p parallel-re/image-ui/rtl-helpers
          targets=(00401058 00403270 00403278 00403308 0040487C 004049CC)
          pids=()
          for target in "${targets[@]}"; do
            (python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/image-ui/rtl-helpers/helper-$target.md 100 ret) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Resolve scanner and image file I/O helper boundaries
        shell: bash
        run: |
          mkdir -p parallel-re/image-io
          python tools/list_pe_imports.py analysis-input/EmwatMethods.bpl1 parallel-re/image-io/imports.md
          targets=(004AFE78 004AFE90 004AFE98 004AFEA0 004AFEA8 004AFEB8 004AFEC0 004AFF18 00402684 004026A4 00402918 00402920)
          pids=()
          for target in "${targets[@]}"; do
            (
              set -e
              python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/image-io/helper-$target.md 1800 ret
              python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/image-io/helper-$target-pointers.md
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Resolve scanner API imports and enumerate exact callsites
        shell: bash
        run: |
          mkdir -p parallel-re/image-io/scanner-api
          python tools/scan_pe_iat_callers.py analysis-input/EmwatMethods.bpl1 \
            0x00630CE4 0x00630CE8 0x00630D0C 0x00630D04 0x00630D08 \
            > parallel-re/image-io/scanner-api/iat-callsites.md
          targets=(004AFF28 004AFF30 004AFED8 004AFEE8 004AFEE0)
          pids=()
          for target in "${targets[@]}"; do
            (
              set -e
              python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target \
                parallel-re/image-io/scanner-api/helper-$target.md 100 ret
              python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target \
                parallel-re/image-io/scanner-api/callers-$target.md
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Decode scanner and ImageGear output-path constants
        run: |
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 \
            0x0061DEE8 0x0061DB8E 0x0061DBA8 0x0061DBC0 0x0061DBF0 \
            0x0061DC20 0x0061DC38 0x0061DC7C 0x004EF708 \
            0x004EF844 0x004EF878 0x004EF9B0 \
            > parallel-re/image-io/scanner-api/output-path-constants.md
      - name: Inventory preserved image form resources without changing them
        run: |
          python - <<'PY'
          import hashlib, pathlib, re
          paths = [
              pathlib.Path("analysis-input/RCDATA_TFRMGSCANPREVIEW_13.bin"),
              pathlib.Path("analysis-input/RCDATA_TFRMIMAGETOOLS_14.bin"),
              pathlib.Path("analysis-input/RCDATA_TFRMSIMPLEIMAGEEDITOR_18.bin"),
          ]
          out = ["# Preserved image form resource inventory", ""]
          for path in paths:
              data = path.read_bytes()
              out += [f"## {path.name}", "", f"- Size: {len(data)} bytes",
                      f"- SHA-256: {hashlib.sha256(data).hexdigest()}",
                      f"- Header: {data[:32].hex(' ')}", "- Printable ASCII strings:"]
              strings = []
              for m in re.finditer(rb"[ -~]{4,}", data):
                  value = m.group().decode("ascii", "replace")
                  if re.search(r"(?i)^(T[A-Z][A-Za-z0-9_]{2,}|On[A-Z]|[A-Za-z][A-Za-z0-9_]{2,})$", value):
                      strings.append((m.start(), value))
              out += [f"  - 0x{off:04X}: {value}" for off, value in strings[:250]]
              out.append("")
          pathlib.Path("parallel-re/image-ui/form-resource-inventory.md").write_text(
              "\n".join(out) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-parallel-image-ui
          path: parallel-re/
          if-no-files-found: error

  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native image dependencies
        run: sudo apt-get update && sudo apt-get install -y libpng-dev libjpeg-dev libtiff-dev libsane-dev
      - name: Build and run native regression suite
        run: |
          cmake -S native -B native/build-parallel -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build-parallel --parallel 2
          ctest --test-dir native/build-parallel --output-on-failure
      - name: Run Python bridge regression suite
        run: |
          python -m pip install -e ./python pytest
          python -m pytest -q python/tests
