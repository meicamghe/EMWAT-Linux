            > parallel-re/image-io/imageen/imageen-iat-callsites.md
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            TScanDocument TImageEdition TScanCommand TResultImage TSetOfSinglePageImages TSetOfMultiPageImages TXMLResponseScanType TXMLScanedImageType TXMLConfigType TXMLOutputType TXMLConstraintsType TImageEnMIO Acquire \
