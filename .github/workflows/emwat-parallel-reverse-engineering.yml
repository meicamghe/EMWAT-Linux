name: EMWAT parallel reverse-engineering lanes
on:
  push:
    paths:
      - '.github/workflows/emwat-parallel-reverse-engineering.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'analysis-input/RCDATA_TFRMGSCANPREVIEW_13.bin'
      - 'analysis-input/RCDATA_TFRMIMAGETOOLS_14.bin'
      - 'analysis-input/RCDATA_TFRMSIMPLEIMAGEEDITOR_18.bin'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/list_td32_symbols.py'
      - 'tools/resolve_delphi_vmt_slots.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/scan_pe_iat_callers.py'
      - 'tools/decode_pe_strings.py'
      - 'tools/trace_pe_target.py'
      - 'native/**'
      - 'python/**'
      - '.github/workflows/native-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emwat-parallel-re-${{ github.ref }}
  cancel-in-progress: true

jobs:
  word-print-com:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace Word print dispatch and callback helpers
        shell: bash
        run: |
          mkdir -p parallel-re/word-print
          targets=(004C5FF8 004309F8 00441E44 00436030 004360F0 004361B0 00445B70 004677B8 00467788 004A5C10 004A5D78 004A5EA8 004D2EC8 004D2F44 00403550 004034E8 00403520 004034D0 00403368 00403480 0042ABA0 004ADA4C 0043EC28 0043EAB8 0043F308 00440B2C 00403488 0043FF40 0043FFA0 004A8F78 004A8FCC 004A8E58 004A90D4 004A9464 004A9884 004A9A08 0047CAF0 0047CC6C 0047CC94 0047D054 0047D238 0047D448)
          pids=()
          for target in "${targets[@]}"; do
            (
              set -e
              python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/word-print/procedure-$target.md
              python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/word-print/callers-$target.md
              python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/word-print/pointers-$target.md
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Decode Delphi Variant runtime helper bodies outside TD32 procedure ranges
        shell: bash
        run: |
          mkdir -p parallel-re/word-print/rtl-helpers
          targets=(00403550 004034E8 00403520 004034D0 00403368 00403480 00401420 00401478)
          pids=()
          for target in "${targets[@]}"; do
            (python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target parallel-re/word-print/rtl-helpers/helper-$target.md 100 ret) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Index Word automation and print-handler symbols
        run: |
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            TWordDocument TWordApplication PrintOut PrintOutOld PrintOut2000 PerformMethod TEditWordDocument TCompareWordDocument TEditExcelWorkBook TFaxDocument TScanDocument TImageEdition TGetEmwatVersion TSetEmwatVersion TShowEmwatSetting TShowLastEditedDocs TShowSendLog TUpgradeEmwat TEmwatMethod EmwatServiceCommandGet LoadDocument Invoke Finalization \
            BGPrintWithGamPrintOptions TEmwatDocPrintHandler TEDPController TWordViwer \
            Zanprinter GetPrinterName ActivePrinter TPrinter \
            > parallel-re/word-print/symbol-index.md
      - name: Trace concrete connector PerformMethod and dispatch targets
        shell: bash
        run: |
          mkdir -p parallel-re/word-print/connector-handlers
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import re
          import subprocess
          import sys

          source = Path("parallel-re/word-print/symbol-index.md").read_text()
          rows = []
          wanted = (
              "EditWordDocument", "CompareWordDocument", "EditExcelWorkBook",
              "FaxDocument", "ScanDocument", "ImageEdition", "GetEmwatVersion",
              "SetEmwatVersion", "ShowEmwatSetting", "ShowLastEditedDocs",
              "ShowSendLog", "UpgradeEmwat", "TEmwatMethod", "EmwatServiceCommandGet",
              "TWordViwer"
          )
          pattern = re.compile(r"^\|\s*\x60(0x[0-9A-Fa-f]+)\x60\s*\|\s*(\d+)\s*\|[^|]*\|\s*\d+\s*\|\s*\x60([^\x60]+)\x60\s*\|")
          for line in source.splitlines():
              match = pattern.match(line)
              if not match:
                  continue
              address, _size, symbol = match.groups()
              if ("PerformMethod" in symbol or "LoadDocument" in symbol or "Invoke" in symbol or "EmwatServiceCommandGet" in symbol or "Finalization" in symbol) and any(token in symbol for token in wanted):
                  rows.append((address, symbol))
          rows = sorted(set(rows))
          Path("parallel-re/word-print/connector-handlers/selected-symbols.txt").write_text(
              "\n".join(f"{address} {symbol}" for address, symbol in rows) + "\n"
          )

          def trace(item):
              address, symbol = item
              safe = address.replace("0x", "")
              out = Path("parallel-re/word-print/connector-handlers")
              subprocess.run([
                  sys.executable, "tools/trace_td32_procedure.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  str(out / f"procedure-{safe}.md")
              ], check=True)
              subprocess.run([
                  sys.executable, "tools/trace_td32_callers.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  str(out / f"callers-{safe}.md")
              ], check=True)
              return address, symbol

          with ThreadPoolExecutor(max_workers=6) as pool:
              futures = [pool.submit(trace, item) for item in rows]
              for future in as_completed(futures):
                  address, symbol = future.result()
                  print(f"traced {address} {symbol}")
          print(f"connector targets traced: {len(rows)}")
          PY
      - name: Decode remaining connector handler keys and response strings
        run: |
          mkdir -p parallel-re/word-print/connector-handlers
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 \
            0x005EED54 0x005EED6C 0x005EEDB4 0x005EEDCC \
            0x005EEE81 0x005EEE88 0x005EEEFF 0x005EF0EC 0x005EF10C \
            0x005EF1A4 0x005EF1DC \
            0x005EF6E8 0x005EF6FC 0x005EF750 0x005EF768 0x005EF804 0x005EF818 \
            0x005EFAF0 0x005EFB20 0x005EFB48 0x005EFB60 0x005EFBA8 \
            0x005EFD3C 0x005EFE44 0x005EFF44 \
            > parallel-re/word-print/connector-handlers/handler-string-constants.md
      - name: Trace shared connector dispatch and service helpers
        shell: bash
        run: |
          mkdir -p parallel-re/word-print/connector-handlers/shared-helpers
          targets=(0046C9E0 005EFF4C 00502F70 0050291C 005E72B8 005E9B4C 005E9BC0 00404D5C 0044CE44 0046D2E4 0046DE84 0046E324 0046E3CC 004738CC)
          pids=()
          for target in "${targets[@]}"; do
            (
              set -e
              python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target \
                parallel-re/word-print/connector-handlers/shared-helpers/procedure-$target.md
              python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target \
                parallel-re/word-print/connector-handlers/shared-helpers/callers-$target.md
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Decode printer selection and installation string constants
        run: |
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 \
            0x0047CC64 0x0047CF90 0x0047CFB8 0x0047CFC4 \
            0x0047CFDC 0x0047CFEC 0x0047D00C 0x0047D02C 0x0047D048 \
            0x0047D3CC 0x0047D3DC 0x0047D3F8 0x0047D408 0x0047D434 \
            0x0047D678 0x0047D688 0x0047D69C 0x0047D6AC 0x0047D6B8 \
            0x0047D6D4 0x0047D6EC 0x0047D704 0x0047D708 0x0047D72C \
            0x0047D740 0x0047D74C 0x0047D764 0x0047D770 0x0047D778 \
            0x0047D790 0x0047D798 0x0047D7B0 0x0047D7B4 0x0047D7C8 \
            0x0047D800 0x0047D828 0x0047D840 0x0047D85C 0x0047D86C \
            0x0047D880 0x0047D8A0 \
            0x0047D161 0x0047D170 0x0047D1EC 0x0047D218 0x0047D228 0x0047D168 \
            > parallel-re/word-print/printer-string-constants.md
      - name: Resolve Winspool printer enumeration helper
        run: |
          mkdir -p parallel-re/word-print/printer-api
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004044CC \
            parallel-re/word-print/printer-api/helper-004044CC.md 100 ret
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004044CC \
            parallel-re/word-print/printer-api/callers-004044CC.md
          python tools/scan_pe_iat_callers.py analysis-input/EmwatMethods.bpl1 \
            0x0062F9E4 0x0062F9E8 0x0062F9EC 0x0062F9F0 0x0062F9F4 \
            > parallel-re/word-print/printer-api/winspool-iat-callsites.md
      - name: Expand GAM printer installer and status procedure traces
        shell: bash
        run: |
          mkdir -p parallel-re/word-print/printer-api/full-procedures
          targets=(0047CC94 0047D054 0047D238 0047D448 0047CAF0)
          pids=()
          for target in "${targets[@]}"; do
            (
              set -e
              python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target \
                parallel-re/word-print/printer-api/full-procedures/procedure-$target.md 1800 ret
              python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target \
                parallel-re/word-print/printer-api/full-procedures/callers-$target.md
              python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target \
                parallel-re/word-print/printer-api/full-procedures/pointers-$target.md
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Resolve GAM printer registry and INI helper APIs
        shell: bash
        run: |
          mkdir -p parallel-re/word-print/printer-api/config-helpers
          targets=(0040275C 00404494 00402674 0040267C 0040266C 00402754 004044AC 004032C0 004032C8 00402818 00403438 00404F4C 00404F54 00402910 00403320 00403350 00401368 00401370 00401378)
          pids=()
          for target in "${targets[@]}"; do
            (
              set -e
              python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target \
                parallel-re/word-print/printer-api/config-helpers/helper-$target.md 180 ret
              python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target \
                parallel-re/word-print/printer-api/config-helpers/callers-$target.md
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-parallel-word-print
          path: parallel-re/word-print/
          if-no-files-found: error

