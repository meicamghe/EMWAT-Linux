name: EMWAT scanner XML interface dispatch contract
on:
  push:
    paths:
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/list_td32_symbols.py'
      - 'tools/trace_td32_procedure_skipdata.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/scan_pe_pointer_refs.py'
      - '.github/workflows/emwat-scanner-xml-interface-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emwat-scanner-xml-interface-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xml-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace XML interface type names and dispatch sites
        shell: bash
        run: |
          mkdir -p scanner-xml-interface
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            IXMLDocument IXMLNode IXMLNodeList IXMLNamedNodeMap TXMLDocument TXMLNode \
            AddChild ChildNodes Attributes GetDocumentElement NodeName NodeValue \
            NewScanDocument LoadRequestXML VerifyConstraints Finalization \
            > scanner-xml-interface/symbol-index.md
          for target in 0x004E9D5C 0x004F2B18 0x004F2C4C 0x004F32F4 0x004E9188 0x0062A7FC 0x0062A850; do
            safe=${target#0x}
            python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 "$target" \
              "scanner-xml-interface/procedure-$safe.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$target" \
              "scanner-xml-interface/callers-$safe.md" || true
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 "$target" \
              "scanner-xml-interface/pointers-$safe.md" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-scanner-xml-interface-contract
          path: scanner-xml-interface/
          if-no-files-found: error

  xml-inline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Decode inline request and response XML constants
        shell: bash
        run: |
          mkdir -p scanner-xml-interface/inline-contract
          python - <<'PY'
          from pathlib import Path
          import pefile
          blob=Path("analysis-input/EmwatMethods.bpl1").read_bytes()
          pe=pefile.PE(data=blob,fast_load=True)
          base=pe.OPTIONAL_HEADER.ImageBase
          addresses=[
              ("LoadRequestXML root/error constants",0x004F2BF8),
              ("LoadRequestXML child/property constant",0x004F2C0C),
              ("NewScanDocument node name",0x004E9DE4),
              ("NewScanDocument property name",0x004E9E00),
              ("VerifyConstraints boolean literal A",0x004F31F8),
              ("VerifyConstraints boolean literal B",0x004F3210),
              ("VerifyConstraints boolean literal C",0x004F3224),
              ("VerifyConstraints boolean literal D",0x004F3230),
              ("Finalization color-mode label",0x004F32DC),
          ]
          out=["# Scanner XML inline constant candidates","",
               "Decoded text is a static candidate; use callsite context before assigning schema meaning.",""]
          for label,va in addresses:
              out.append(f"## {label} @ 0x{va:08X}")
              try:
                  off=pe.get_offset_from_rva(va-base)
                  raw=blob[off:off+96]
                  out.append(f"- file offset: 0x{off:08X}")
                  out.append(f"- raw bytes: {raw.hex(' ')}")
                  for enc in ("utf-16le","utf-8","latin1"):
                      s=raw.decode(enc,"ignore").split(chr(0),1)[0]
                      if s and sum(ch.isprintable() for ch in s)>2:
                          out.append(f"- {enc}: {s!r}")
              except Exception as exc:
                  out.append(f"- read error: {exc}")
              out.append("")
          Path("scanner-xml-interface/inline-contract/constants.md").write_text("\n".join(out)+"\n")
          PY
          for target in 0x004F2BF8 0x004F2C0C 0x004E9DE4 0x004E9E00; do
            safe=${target#0x}
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 "$target" \
              "scanner-xml-interface/inline-contract/pointers-$safe.md" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-scanner-xml-inline-contract
          path: scanner-xml-interface/inline-contract/
          if-no-files-found: error
