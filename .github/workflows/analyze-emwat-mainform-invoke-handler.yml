name: Analyze EMWAT main form invoke handler
on:
  push:
    paths:
      - '.github/workflows/analyze-emwat-mainform-invoke-handler.yml'
      - 'EMWAT_Extracted.zip'
      - 'tools/trace_pe_target.py'
      - 'tools/trace_pe_range.py'
      - 'tools/scan_pe_pointer_refs.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mainform-invoke-handler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Extract EmwatService
        run: |
          python - <<'PY'
          import pathlib, zipfile
          archive = zipfile.ZipFile("EMWAT_Extracted.zip")
          matches = [n for n in archive.namelist() if pathlib.PurePosixPath(n).name.lower() == "emwatservice.exe"]
          if not matches:
              raise SystemExit("EmwatService.exe not found")
          target = pathlib.Path("mainform-invoke/EmwatService.exe")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(archive.read(matches[0]))
          print(f"Extracted {matches[0]} ({target.stat().st_size} bytes)")
          PY
      - name: Trace main form event handler and initialization
        shell: bash
        run: |
          mkdir -p mainform-invoke
          for target in 0047BF30 0047CCD8 0047D2C8 0047CA88 00477098 00477190 0047E0EC 0047E2D4 0047E7E4 00470D00 00470B38 00471214 00471050 00470924 0046ADBC 00463F54 00464310 0046440C 00470A58 00464444 004670A8 0046A7A4 0046A620 0046A570 0046A544 0046A7BC 0046A894 0046AA70; do
            python tools/trace_pe_target.py mainform-invoke/EmwatService.exe 0x$target mainform-invoke/target-$target.md 7000 ret
            python tools/scan_pe_pointer_refs.py mainform-invoke/EmwatService.exe 0x$target mainform-invoke/refs-$target.md
          done
          python tools/trace_pe_range.py mainform-invoke/EmwatService.exe 0x0047B820 0x0047B8D0 mainform-invoke/mainform-method-table.md
          python tools/trace_pe_range.py mainform-invoke/EmwatService.exe 0x0047BA70 0x0047BB90 mainform-invoke/mainform-commandget-rtti.md
          python tools/trace_pe_range.py mainform-invoke/EmwatService.exe 0x0047C0E5 0x0047C341 mainform-invoke/commandget-finally-and-response-tail.md
          python tools/trace_pe_range.py mainform-invoke/EmwatService.exe 0x00470D00 0x00471040 mainform-invoke/method-dispatcher-full-range.md
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-mainform-invoke-handler
          path: mainform-invoke/
          if-no-files-found: error

