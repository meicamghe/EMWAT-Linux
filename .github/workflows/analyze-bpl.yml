name: Analyze EMWAT Methods BPL
on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/analyze_emwat_bpl.py'
      - '.github/workflows/analyze-bpl.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - run: python tools/analyze_emwat_bpl.py
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-bpl-static-analysis
          path: bpl-analysis/EmwatMethods-static-analysis.md
          if-no-files-found: error
