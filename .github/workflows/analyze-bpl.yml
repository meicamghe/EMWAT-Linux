name: Analyze EMWAT Methods BPL
on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/analyze_emwat_bpl.py'
      - 'tools/analyze_emwat_td32.py'
      - 'tools/disassemble_emwat_targets.py'
      - 'tools/diagnose_emwat_code_offsets.py'
      - 'tools/inspect_td32_module_map.py'
      - 'tools/resolve_td32_helpers.py'
      - 'tools/resolve_delphi_vmt_slots.py'
      - 'tools/trace_rotate90_object.py'
      - 'tools/trace_rotate90_dispatch.py'
      - 'tools/trace_pe_target.py'
      - 'tools/trace_delphi_interfaces.py'
      - 'tools/trace_imaging_import_callers.py'
      - '.github/workflows/analyze-bpl.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - run: python tools/analyze_emwat_bpl.py
      - run: python tools/analyze_emwat_td32.py analysis-input/EmwatMethods.bpl1
      - run: python tools/disassemble_emwat_targets.py analysis-input/EmwatMethods.bpl1
      - run: python tools/diagnose_emwat_code_offsets.py analysis-input/EmwatMethods.bpl1
      - run: python tools/inspect_td32_module_map.py analysis-input/EmwatMethods.bpl1
      - run: python tools/resolve_td32_helpers.py analysis-input/EmwatMethods.bpl1
      - run: python tools/resolve_delphi_vmt_slots.py analysis-input/EmwatMethods.bpl1
      - run: python tools/trace_rotate90_object.py analysis-input/EmwatMethods.bpl1
      - run: python tools/trace_rotate90_dispatch.py analysis-input/EmwatMethods.bpl1
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004AFF38
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00401058 bpl-analysis/EmwatMethods-crop-coordinate-helper.md
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004EF048 bpl-analysis/EmwatMethods-scanner-helper-4EF048.md
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004EF1DC bpl-analysis/EmwatMethods-scanner-helper-4EF1DC.md
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004049CC bpl-analysis/EmwatMethods-scanner-helper-4049CC.md
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0061D100 bpl-analysis/EmwatMethods-scanner-helper-61D100.md
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004F1158 bpl-analysis/EmwatMethods-editor-get-modal-result.md
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004F1164 bpl-analysis/EmwatMethods-editor-hello.md
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004F116C bpl-analysis/EmwatMethods-editor-initial.md
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004F17B4 bpl-analysis/EmwatMethods-editor-register-click.md
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004EFF94 bpl-analysis/EmwatMethods-set-editor-form.md
      - run: python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004ECF30 bpl-analysis/EmwatMethods-helper-4ECF30.md
