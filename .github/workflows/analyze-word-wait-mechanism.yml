name: Analyze EMWAT Word wait and COM call chain
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-word-wait-mechanism.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/inspect_delphi_vmt_address.py'
      - 'tools/find_td32_class_procedures.py'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/trace_pe_range.py'
permissions:
  contents: read
jobs:
  wait-mechanism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Inspect TWordApplication VMT and Connect slot
        run: |
          mkdir -p wait-mechanism-analysis/vmt
          mkdir -p bpl-analysis
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x004202A8
          cp bpl-analysis/EmwatMethods-vmt-address.md wait-mechanism-analysis/vmt/TWordApplication-vmt.md
          python - <<'PY'
          import pathlib, re, subprocess, sys
          source = pathlib.Path("wait-mechanism-analysis/vmt/TWordApplication-vmt.md").read_text(encoding="utf-8")
          targets = sorted(set(
              match.group(1)
              for line in source.splitlines()
              if "Slot +0x50:" in line
              for match in [re.search(r"0x([0-9A-Fa-f]{8})", line)]
              if match
          ))
          summary = ["# TWordApplication VMT +0x50 target traces", ""]
          for target in targets:
              output = f"wait-mechanism-analysis/vmt/slot-50-{target}.md"
              subprocess.run([sys.executable, "tools/trace_td32_procedure.py", "analysis-input/EmwatMethods.bpl1", "0x" + target, output], check=True)
              summary.append(f"- Slot +0x50 target 0x{target}: {output}")
          pathlib.Path("wait-mechanism-analysis/vmt/slot-50-index.md").write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY
      - name: Trace Word COM setup and activation branch
        run: |
          mkdir -p wait-mechanism-analysis/word-com
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B8D12 0x004B8E90 wait-mechanism-analysis/word-com/OnTmrAutoSave-connect-and-quit.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B8A84 0x004BA058 wait-mechanism-analysis/word-com/OnTmrAutoSave-entry-to-main-tail.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004BA058 0x004BB3AF wait-mechanism-analysis/word-com/OnTmrAutoSave-final-tail.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B9900 0x004B9A80 wait-mechanism-analysis/word-com/OnTmrAutoSave-timer-registration.md
          for target in 0043E070 0043E0F0 0043E0FC 0043E174 0043E270 0042ABF8 00404FAC 00404F8C 00401188 00401430 00401420 00401478 00403550 00403480 00403ED0 00403ED8 0043F360 00440950 00440A68 00441C68 004CDB54 004C5D68 004B8A84 004B7724; do
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target wait-mechanism-analysis/word-com/procedure-$target.md
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target wait-mechanism-analysis/word-com/callers-$target.md
          done
      - name: Search VCL wait, message-pump, and Word connection methods
        run: |
          mkdir -p wait-mechanism-analysis/classes
          python tools/find_td32_class_procedures.py analysis-input/EmwatMethods.bpl1 TApplication TThread TTimer TWordApplication TOleServer TWordViwer TEditWordDocument > wait-mechanism-analysis/classes/candidate-methods.md
          python - <<'PY'
          import pathlib, re, subprocess, sys
          source = pathlib.Path("wait-mechanism-analysis/classes/candidate-methods.md").read_text(encoding="utf-8")
          terms = re.compile(r"wait|processmessages|handlemessage|connect|disconnect|quit|showmodal|synchronize|execute|visible|open|timer", re.I)
          rows = []
          for line in source.splitlines():
              parts = [part.strip() for part in line.split("|")]
              if len(parts) < 4:
                  continue
              module, decorated, target = parts[1], parts[2].strip(chr(96)), parts[3]
              match = re.search(r"0x([0-9A-Fa-f]{8})", target)
              if match and terms.search(decorated):
                  rows.append((module, decorated, match.group(1)))
          outdir = pathlib.Path("wait-mechanism-analysis/classes/traces")
          outdir.mkdir(parents=True, exist_ok=True)
          summary = ["# Selected VCL/Word method traces", ""]
          seen = set()
          for module, decorated, va in rows:
              if va in seen:
                  continue
              seen.add(va)
              safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", decorated)[:80]
              output = outdir / f"{va}-{safe}.md"
              subprocess.run([sys.executable, "tools/trace_td32_procedure.py", "analysis-input/EmwatMethods.bpl1", "0x" + va, str(output)], check=True)
              summary.append(f"- {module} — 0x{va} — {decorated} — {output}")
          pathlib.Path("wait-mechanism-analysis/classes/trace-index.md").write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY
      - name: List imported wait and message APIs with call sites
        run: |
          python - <<'PY'
          import pathlib, struct, pefile
          pe = pefile.PE("analysis-input/EmwatMethods.bpl1")
          wanted = ("wait", "sleep", "message", "peek", "dispatch", "process", "coWait", "inputIdle")
          rows = ["# Imported wait/message APIs and direct call sites", ""]
          for dll in getattr(pe, "DIRECTORY_ENTRY_IMPORT", []):
              for imp in dll.imports:
                  name = (imp.name or b"").decode("ascii", errors="replace")
                  if not any(term.lower() in name.lower() for term in wanted):
                      continue
                  rows.append(f"## {dll.dll.decode('ascii', errors='replace')}!{name}")
                  rows.append(f"- IAT VA: 0x{imp.address:08X}")
                  pattern = b"\xFF\x15" + struct.pack("<I", imp.address)
                  for section in pe.sections:
                      data = section.get_data()
                      start = 0
                      while True:
                          offset = data.find(pattern, start)
                          if offset < 0:
                              break
                          va = pe.OPTIONAL_HEADER.ImageBase + section.VirtualAddress + offset
                          rows.append(f"- CALL [IAT] at VA 0x{va:08X}")
                          start = offset + 1
                  rows.append("")
          pathlib.Path("wait-mechanism-analysis/imported-wait-apis.md").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
      - name: Trace exact wait thunk entries and Word OpenDoc routine
        shell: bash
        run: |
          mkdir -p wait-mechanism-analysis/exact-thunks
          for target in 004028D0 00402900 00403438 00404224 00404F04; do
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target wait-mechanism-analysis/exact-thunks/thunk-$target.md 160 ret
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target wait-mechanism-analysis/exact-thunks/thunk-$target-callers.md
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target wait-mechanism-analysis/exact-thunks/thunk-$target-pointer-refs.md
          done
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004028C0 0x00402920 wait-mechanism-analysis/exact-thunks/kernel32-wait-sleep-thunk-table.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x00404EF0 0x00404F20 wait-mechanism-analysis/exact-thunks/vcl-processmessages-thunk.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x004B7430 wait-mechanism-analysis/exact-thunks/Wordviewer-OpenDoc.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004B7430 wait-mechanism-analysis/exact-thunks/Wordviewer-OpenDoc-callers.md
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B7430 wait-mechanism-analysis/exact-thunks/Wordviewer-OpenDoc-full.md 2400 ret
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B7430 0x004B7724 wait-mechanism-analysis/exact-thunks/Wordviewer-OpenDoc-range.md
          for target in 004B9AE8 004B9C87 004B9F1C 004BA2DF; do
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target wait-mechanism-analysis/exact-thunks/OnTmrAutoSave-$target.md 1200 ret
          done
      - name: Scan imported wait and message API references
        run: |
          mkdir -p wait-mechanism-analysis/import-references
          for target in 0062F084 0062F09C 00630038 0062EFA8 0062EFE8 0062EF80 0062F350 0062F638; do
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target wait-mechanism-analysis/import-references/IAT-$target-pointer-refs.md
          done
          for target in 00404FAC 00404F8C 00401188 00401430 00403ED0; do
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target wait-mechanism-analysis/import-references/helper-$target-callers.md
          done
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B7A20 0x004B7A80 wait-mechanism-analysis/import-references/LoadDocument-OnTmrAutoSave-call.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B7F00 0x004B7FC0 wait-mechanism-analysis/import-references/LoadDocument-response-write.md
      - name: Trace call sites for imported wait and message-pump thunks
        run: |
          mkdir -p wait-mechanism-analysis/wait-callers
          for target in 00402902 004028D2 00404F06 00402AB2 00402A2A 00402B02 0040343A 00404226; do
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target wait-mechanism-analysis/wait-callers/thunk-$target-callers.md
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target wait-mechanism-analysis/wait-callers/thunk-$target-pointer-refs.md
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target wait-mechanism-analysis/wait-callers/thunk-$target.md 80 ret
          done
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-word-wait-mechanism
          path: wait-mechanism-analysis/
