name: Analyze EMWAT TCP capture
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-network-capture.yml'
      - 'tools/analyze_tcp_payloads.py'
      - 'tcp-payloads.txt'
permissions:
  contents: read
jobs:
  network-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze HTTP metadata without exposing document contents
        run: |
          mkdir -p network-analysis
          python tools/analyze_tcp_payloads.py tcp-payloads.txt network-analysis/summary.md
          test -s network-analysis/summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-network-capture-metadata
          path: network-analysis/summary.md
