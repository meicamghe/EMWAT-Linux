name: Analyze EMWAT Word custom-property helpers
on:
  push:
    paths:
      - '.github/workflows/analyze-word-custom-property-pipeline.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/trace_pe_target.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/list_td32_symbols.py'
      - 'tools/analyze_emwat_td32.py'
      - 'tools/decode_pe_strings.py'
      - 'tools/inspect_delphi_vmt_address.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custom-property-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace custom-property, field-name, and silent-save helpers in parallel
        shell: bash
        run: |
          mkdir -p word-custom-property-pipeline
          printf '%s\n' 004D531C 004D68D4 004D1808 004CB638 004D3F24 004D4528 004D45CC 004D23D8 004D3DF8 004D34B0 004D1B30 0045644C 004BFDB0 004BC170 004D08B4 004D1148 004D1454 004D3B78 004D3B38 004D3D2C 004D3D3C 004D52DC 004D54D0 004D54E0 004D6894 004D6A88 004D6A98 004BFC18 004BB81C 004C0550 004B7724 00402908 00473608 00473700 004D00AC 0047893C 00478A84 004787F0 004786A4 00478444 00478568 00478BC8 004789C8 00478880 00478B10 004BB3B0 004D2EC8 0044B4C0 0044B488 > /tmp/targets
          pids=()
          while read -r target; do
            (
              set -e
              python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target word-custom-property-pipeline/procedure-$target.md
              python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target word-custom-property-pipeline/callers-$target.md
              python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target word-custom-property-pipeline/pointer-refs-$target.md
            ) &
            pids+=("$!")
          done < /tmp/targets
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Extend helper disassembly around field and dictionary operations
        shell: bash
        run: |
          pids=()
          for spec in "004D531C 900" "004D68D4 900" "004D1808 700" "004D23D8 1200" "004CB638 700" "004D3F24 700" "004D4528 700" "004D45CC 500" "004D3DF8 700" "004D34B0 700" "004D1B30 900" "0045644C 1000" \
            "004BFDB0 1000" "004BC170 900" "004D08B4 1200" "004D1148 1200" \
            "004D1454 1200" "004D3B78 700" "004D3B38 500" "004D3D2C 400" "004D3D3C 500" \
            "004D52DC 500" "004D54D0 400" "004D54E0 500" "004D6894 500" \
            "004D6A88 400" "004D6A98 500" "004BFC18 500" "004BB81C 2600" "004C0550 1500" "004B7724 1800" \
            "00402908 900" "00473608 500" "00473700 500" "004D00AC 1400" \
            "0047893C 300" "00478A84 300" "004787F0 300" "004786A4 300" \
            "00478444 300" "00478568 300" "00478BC8 300" "004789C8 300" \
            "00478880 300" "00478B10 300" "004BB3B0 1600" "004D2EC8 1000" "0044B4C0 700" "0044B488 700" \
            "004012F8 500" "00401358 500" "00401488 400" "00401350 400" \
            "00403248 500" "00403268 400" "00401398 400" "00401388 400" \
            "00455314 700" "00455108 700" "004735D0 500" "004738CC 700" "00473608 700" "00473700 700"; do
            (
              set -e
              set -- $spec
              python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$1 word-custom-property-pipeline/extended-$1.md $2 ret
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Index all related TD32 class methods
        run: |
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            TDocumentCProperty TXmlWordConfigField TXmlWordConfigTwinField \
            TWordViwer TXmlWordConfigFields TEditWordDocument TScanDocument TWordDocument \
            > word-custom-property-pipeline/td32-related-symbols.md
      - name: Inspect XML field object layouts and property VMTs
        run: |
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x004751E4 word-custom-property-pipeline/TXMLFieldType-VMT.md
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x004B068C word-custom-property-pipeline/TXmlWordConfigField-VMT.md
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x004B0774 word-custom-property-pipeline/TXmlWordConfigTwinField-VMT.md
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x004B05A8 word-custom-property-pipeline/TDocumentCProperty-VMT.md
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x004B0DFC word-custom-property-pipeline/TEDPController-VMT.md
      - name: Decode field-name rules and custom-property delimiters
        run: |
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 \
            0x004D1704 0x004D1768 0x004D1778 0x004D13F0 0x004D1384 \
            0x004BBE24 0x004BBE58 0x004BBE9C 0x004BBEE8 \
            0x004BBF1C 0x004BBF6C 0x004BC08C 0x004BC0C0 \
            0x004BFEE8 0x004BFF0C 0x004BC23C 0x004BC260 0x004BC274 \
            0x004D0BD0 0x004D0BF0 0x004D0C18 0x004D0C3C \
            0x004D0C5C 0x004D0C60 0x004D0C70 0x004D0CC8 \
            0x004D1384 0x004D13B4 0x004D141C \
            0x004789B4 0x00478AFC 0x00478868 0x00478A70 0x00478928 0x00478BB8 \
            0x004785E0 0x0047871C 0x00478C40 \
            0x00455454 0x004D0550 0x004D0590 0x004D05A8 0x004D05C0 \
            0x004D05D8 0x004D0610 0x004D0624 0x004D0660 0x004D0670 0x004D06A0 \
            0x004D21D4 0x004D2228 0x004D225C 0x004D226C \
            0x004D22B8 0x004D2304 0x004D2350 0x004D239C \
            > word-custom-property-pipeline/field-name-and-property-strings.md
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-word-custom-property-pipeline
          path: word-custom-property-pipeline/
