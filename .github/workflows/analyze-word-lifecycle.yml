name: Analyze EMWAT Word lifecycle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-word-lifecycle.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/trace_pe_target.py'
      - 'tools/trace_pe_range.py'
      - 'tools/inspect_pe_va.py'
      - 'tools/decode_pe_strings.py'
      - 'tools/resolve_delphi_vmt_slots.py'
      - 'tools/trace_field_accesses.py'
      - 'tools/trace_td32_immediate_refs.py'
      - 'tools/trace_delphi_interfaces.py'
      - 'tools/search_td32_word_methods.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/scan_named_pe_resource.py'
      - 'tools/trace_td32_procedure.py'
concurrency:
  group: word-lifecycle-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  word-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Resolve Word document VMT dispatch slots
        run: |
          mkdir -p word-lifecycle-analysis
          python tools/resolve_delphi_vmt_slots.py analysis-input/EmwatMethods.bpl1 word-lifecycle-analysis/Word-VMT-slots.md
          test -s word-lifecycle-analysis/Word-VMT-slots.md
          grep -n "Slot +0x2BC:" word-lifecycle-analysis/Word-VMT-slots.md || true
      - name: Trace candidate controller VMT slot targets
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          report = pathlib.Path("word-lifecycle-analysis/Word-VMT-slots.md").read_text(encoding="utf-8")
          targets = sorted(set(
              match.group(1)
              for line in report.splitlines()
              if "inside TD32 procedure:" in line
              for match in [re.search(r"Slot \\+0x2BC: 0x([0-9A-Fa-f]{8})", line)]
              if match
          ))
          summary = ["# Controller VMT slot +0x2BC candidate traces", ""]
          if not targets:
              summary.append("No mapped candidate target was emitted by the VMT resolver.")
          for index, target in enumerate(targets):
              out = f"word-lifecycle-analysis/VMT-2BC-{target}.md"
              subprocess.run([sys.executable, "tools/trace_pe_target.py", "analysis-input/EmwatMethods.bpl1", "0x" + target, out, "320", "ret"], check=True)
              summary.append(f"- Candidate {index + 1}: 0x{target} — {out}")
          pathlib.Path("word-lifecycle-analysis/VMT-2BC-candidates.md").write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY
      - name: Extend Word lifecycle callback traces
        run: |
          mkdir -p word-lifecycle-analysis
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CD9C0 word-lifecycle-analysis/4CD9C0-extended.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CE030 word-lifecycle-analysis/4CE030-extended.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004D00AC word-lifecycle-analysis/4D00AC-extended.md 320 ret
