name: Analyze EMWAT Word lifecycle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-word-lifecycle.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/trace_pe_target.py'
      - 'tools/inspect_pe_va.py'
permissions:
  contents: read
jobs:
  word-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Extend Word lifecycle callback traces
        run: |
          mkdir -p word-lifecycle-analysis
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CD9C0 word-lifecycle-analysis/4CD9C0-extended.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CE030 word-lifecycle-analysis/4CE030-extended.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004D00AC word-lifecycle-analysis/4D00AC-extended.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CCBBC word-lifecycle-analysis/BeforeClose-extended.md 240 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CD154 word-lifecycle-analysis/BeforeSave-extended.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044ABE4 word-lifecycle-analysis/44ABE4-extended.md 240 ret
      - name: Inspect callback constants and nearby data
        run: |
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CDAA0 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CDAA0.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CDAB8 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CDAB8.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CDAE4 --before 0x20 --after 0x80 > word-lifecycle-analysis/data-4CDAE4.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CDAF4 --before 0x20 --after 0x80 > word-lifecycle-analysis/data-4CDAF4.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CEB44 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CEB44.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CEB84 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CEB84.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004D0550 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4D0550.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004D0590 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4D0590.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004D05A8 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4D05A8.md
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-word-lifecycle-analysis
          path: word-lifecycle-analysis/
