name: Analyze EMWAT Word lifecycle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-word-lifecycle.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/trace_pe_target.py'
      - 'tools/inspect_pe_va.py'
      - 'tools/resolve_delphi_vmt_slots.py'
      - 'tools/trace_field_accesses.py'
      - 'tools/trace_td32_immediate_refs.py'
      - 'tools/trace_td32_procedure.py'
permissions:
  contents: read
jobs:
  word-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Resolve Word document VMT dispatch slots
        run: |
          mkdir -p word-lifecycle-analysis
          python tools/resolve_delphi_vmt_slots.py analysis-input/EmwatMethods.bpl1 word-lifecycle-analysis/Word-VMT-slots.md
          test -s word-lifecycle-analysis/Word-VMT-slots.md
          grep -n "Slot +0x2BC:" word-lifecycle-analysis/Word-VMT-slots.md || true
      - name: Trace candidate controller VMT slot targets
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          report = pathlib.Path("word-lifecycle-analysis/Word-VMT-slots.md").read_text(encoding="utf-8")
          targets = sorted(set(
              match.group(1)
              for line in report.splitlines()
              if "inside TD32 procedure:" in line
              for match in [re.search(r"Slot \\+0x2BC: 0x([0-9A-Fa-f]{8})", line)]
              if match
          ))
          summary = ["# Controller VMT slot +0x2BC candidate traces", ""]
          if not targets:
              summary.append("No mapped candidate target was emitted by the VMT resolver.")
          for index, target in enumerate(targets):
              out = f"word-lifecycle-analysis/VMT-2BC-{target}.md"
              subprocess.run([sys.executable, "tools/trace_pe_target.py", "analysis-input/EmwatMethods.bpl1", "0x" + target, out, "320", "ret"], check=True)
              summary.append(f"- Candidate {index + 1}: 0x{target} — {out}")
          pathlib.Path("word-lifecycle-analysis/VMT-2BC-candidates.md").write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY
      - name: Extend Word lifecycle callback traces
        run: |
          mkdir -p word-lifecycle-analysis
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CD9C0 word-lifecycle-analysis/4CD9C0-extended.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CE030 word-lifecycle-analysis/4CE030-extended.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004D00AC word-lifecycle-analysis/4D00AC-extended.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CCBBC word-lifecycle-analysis/BeforeClose-extended.md 240 ret
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004CCBBC word-lifecycle-analysis/BeforeClose-direct-callers.md
          python tools/trace_td32_immediate_refs.py analysis-input/EmwatMethods.bpl1 0x004CCBBC word-lifecycle-analysis/BeforeClose-immediate-references.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x004CCF8F word-lifecycle-analysis/FillImgFldsForPrint-full.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x004CCBBC word-lifecycle-analysis/BeforeClose-full-procedure.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004CCDC8 word-lifecycle-analysis/FillImgFldsForPrint-direct-callers.md
          python tools/trace_td32_immediate_refs.py analysis-input/EmwatMethods.bpl1 0x004CCDC8 word-lifecycle-analysis/FillImgFldsForPrint-immediate-references.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x004CB361 word-lifecycle-analysis/GetFieldIndexInList-full.md
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CD154 word-lifecycle-analysis/BeforeSave-extended.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CD54C word-lifecycle-analysis/WordAppNewDocument-4CD54C.md 420 ret
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004CD54C word-lifecycle-analysis/Callers-4CD54C.md
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044ABE4 word-lifecycle-analysis/44ABE4-extended.md 240 ret
      - name: Deep trace autosave and controller dispatch
        run: |
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B8A84 word-lifecycle-analysis/OnTmrAutoSave-full.md 2600 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004BCA88 word-lifecycle-analysis/GetXmlFieldInfo-full.md 1800 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004D281C word-lifecycle-analysis/ControllerNotify-4D281C.md 500 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x005E9258 word-lifecycle-analysis/CloseMyDoc-5E9258.md 260 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x005E9769 word-lifecycle-analysis/UnprotectMyDoc-5E9769.md 260 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00430A1E word-lifecycle-analysis/WordPrintOutOld-callsite-430A1E.md 120 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CDB54 word-lifecycle-analysis/Callback-4CDB54.md 400 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004C5D68 word-lifecycle-analysis/Callback-4C5D68.md 400 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00440950 word-lifecycle-analysis/Helper-440950.md 400 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00440A68 word-lifecycle-analysis/Helper-440A68.md 400 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00441C68 word-lifecycle-analysis/Helper-441C68.md 400 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0042AEF0 word-lifecycle-analysis/WordDocument-GetTables-wrapper-start.md 260 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0042AF00 word-lifecycle-analysis/WordDocument-GetTables-wrapper.md 220 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0042ABA0 word-lifecycle-analysis/WordDocument-interface-accessor-42ABA0.md 260 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00401420 word-lifecycle-analysis/BeforeClose-interface-helper-401420.md 180 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00401478 word-lifecycle-analysis/BeforeClose-interface-helper-401478.md 180 ret
      - name: Trace close lifecycle and Word connector entry points
        run: |
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004BCA88 word-lifecycle-analysis/GetXmlFieldInfo.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B8A84 word-lifecycle-analysis/OnTmrAutoSave.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004BB3B0 word-lifecycle-analysis/OnControlerNotify.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B7430 word-lifecycle-analysis/OpenDoc.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B7724 word-lifecycle-analysis/LoadDocument.md 320 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004BCA00 word-lifecycle-analysis/WordFieldDispatch-near-4BCA00.md 180 ret
      - name: Inspect close callback string data
        run: |
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CDAB8 --before 0x20 --after 0x90 > word-lifecycle-analysis/data-close-4CDAB8.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CDAF4 --before 0x20 --after 0x90 > word-lifecycle-analysis/data-close-4CDAF4.md
      - name: Inspect callback constants and nearby data
        run: |
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CDAA0 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CDAA0.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CDAB8 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CDAB8.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CDAE4 --before 0x20 --after 0x80 > word-lifecycle-analysis/data-4CDAE4.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CDAF4 --before 0x20 --after 0x80 > word-lifecycle-analysis/data-4CDAF4.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CEB44 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CEB44.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CEB84 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CEB84.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004D0550 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4D0550.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004D0590 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4D0590.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004D05A8 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4D05A8.md
      - name: Trace downstream print helpers
        run: |
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004AEBBC word-lifecycle-analysis/helper-4AEBBC.md 240 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CF5B4 word-lifecycle-analysis/helper-4CF5B4.md 220 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CF748 word-lifecycle-analysis/helper-4CF748.md 220 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CFC74 word-lifecycle-analysis/helper-4CFC74.md 220 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004CF158 word-lifecycle-analysis/helper-4CF158.md 220 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x00441E44 word-lifecycle-analysis/helper-441E44.md 160 ret
      - name: Inspect BeforePrint callback messages
        run: |
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CEB9C --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CEB9C.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CEC64 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CEC64.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CEC94 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CEC94.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004CECDC --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4CECDC.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004D06E8 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4D06E8.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004D075C --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4D075C.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004D078C --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4D078C.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004D07D8 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4D07D8.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004D0814 --before 0x20 --after 0xA0 > word-lifecycle-analysis/data-4D0814.md
      - name: Trace Word controller object-field assignments
        run: |
          python tools/trace_field_accesses.py analysis-input/EmwatMethods.bpl1 0x48 word-lifecycle-analysis/Field-0x48-references.md
          python tools/trace_field_accesses.py analysis-input/EmwatMethods.bpl1 0x40 word-lifecycle-analysis/Field-0x40-references.md
          python tools/trace_field_accesses.py analysis-input/EmwatMethods.bpl1 0x44 word-lifecycle-analysis/Field-0x44-references.md
          python tools/trace_field_accesses.py analysis-input/EmwatMethods.bpl1 0x2BC word-lifecycle-analysis/Field-0x2BC-vtable-callers.md
          python tools/trace_field_accesses.py analysis-input/EmwatMethods.bpl1 0xDC word-lifecycle-analysis/Field-0xDC-vtable-callers.md
          python tools/trace_field_accesses.py analysis-input/EmwatMethods.bpl1 0x38 word-lifecycle-analysis/Field-0x38-interface-callers.md
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-word-lifecycle-analysis
          path: word-lifecycle-analysis/
