name: Analyze EMWAT service and BPL dispatch crosswalk
on:
  push:
    paths:
      - 'EMWAT_Extracted.zip'
      - '.github/workflows/analyze-emwat-dispatch-crosswalk.yml'
      - 'analysis-input/EmwatService.exe'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/trace_pe_target.py'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/find_td32_class_procedures.py'
      - 'tools/resolve_delphi_vmt_slots.py'
      - 'tools/trace_delphi_interfaces.py'
      - 'tools/inspect_delphi_vmt_address.py'
      - 'tools/trace_td32_immediate_refs.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/trace_pe_range.py'
      - 'tools/decode_pe_strings.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-request-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract authorized EMWAT analysis binaries
        if: hashFiles('EMWAT_Extracted.zip') != ''
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("EMWAT_Extracted.zip")
          out = Path("analysis-input")
          out.mkdir(exist_ok=True)
          wanted = {"EmwatMethods.bpl1", "EmwatService.exe", "EmwatAgent.exe"}
          with ZipFile(archive) as zf:
              found = {Path(name).name: name for name in zf.namelist() if Path(name).name in wanted}
              for basename in sorted(wanted & found.keys()):
                  (out / basename).write_bytes(zf.read(found[basename]))
                  print(f"Extracted {basename}: {(out / basename).stat().st_size} bytes")
          PY
      - uses: actions/setup-python@v5
        if: hashFiles('analysis-input/EmwatService.exe') != ''
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
        if: hashFiles('analysis-input/EmwatService.exe') != ''
      - name: Trace service HTTP and XML dispatch chain
        shell: bash
        run: |
          mkdir -p dispatch-crosswalk/service
          if [ ! -f analysis-input/EmwatService.exe ]; then
            cat > dispatch-crosswalk/service/INPUT-NOT-PRESENT.md <<'EOF'
          # Service PE trace not run

          `analysis-input/EmwatService.exe` is not present in the public repository at this revision.
          The service addresses below are leads from earlier analysis notes, not newly verified traces:
          - 0x0047BF30 — MainForm HTTP command handler
          - 0x0047E0EC — invoke-route helper
          - 0x00470D00 / 0x00470B38 — XML ParseMethod wrapper/worker
          - 0x0046ADBC / 0x0046A7A4 — token dispatch/parser-record collection

          No service executable has been added or inferred. Add a sanitized, authorized analysis copy to `analysis-input/EmwatService.exe` before enabling this trace.
          EOF
            echo "EmwatService.exe absent; service trace intentionally skipped."
          else
            for address in 0x0047BF30 0x0047E0EC 0x0047E2D4 0x004610FC 0x00401156 0x00401158 0x0040115E 0x00401160 0x004011B6 0x004011B8 0x00401462 0x00401464 0x00401D7A 0x00401D7C 0x00402172 0x00402174 0x00402352 0x00402354 0x00470D00 0x00470B38 0x00471214 0x0046AA70 0x0046ADBC 0x0046A7A4 0x0046A620 0x0046A570; do
              name=${address#0x}
              python tools/trace_pe_target.py analysis-input/EmwatService.exe "$address" "dispatch-crosswalk/service/$name.md" 1200 ret
              python tools/trace_td32_procedure.py analysis-input/EmwatService.exe "$address" "dispatch-crosswalk/service/$name-td32.md" || true
              python tools/trace_td32_callers.py analysis-input/EmwatService.exe "$address" "dispatch-crosswalk/service/$name-callers.md" || true
            done
            python -m py_compile tools/inspect_delphi_vmt_address.py
            python tools/inspect_delphi_vmt_address.py analysis-input/EmwatService.exe 0x0047B284 dispatch-crosswalk/service/mainform-vmt.md || true
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatService.exe 0x0047B284 dispatch-crosswalk/service/mainform-vmt-pointer-refs.md || true
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatService.exe 0x0047BF0C dispatch-crosswalk/service/mainform-classinfo-pointer-refs.md || true
            python tools/trace_pe_range.py analysis-input/EmwatService.exe 0x0047BF30 0x0047C341 dispatch-crosswalk/service/mainform-request-handler-full.md
            python tools/trace_pe_range.py analysis-input/EmwatService.exe 0x00470D00 0x00471033 dispatch-crosswalk/service/parse-method-full.md
            for range in "0x0045EA80 0x0045EC20" "0x0045F780 0x0045F940" "0x00470E80 0x00471020" "0x0047C180 0x0047C300" "0x0047D8C0 0x0047D980" "0x0047DB00 0x0047DBD0" "0x0047DD40 0x0047DE10"; do
              set -- $range
              name=${1#0x}
              python tools/trace_pe_range.py analysis-input/EmwatService.exe "$1" "$2" "dispatch-crosswalk/service/callsite-context-$name.md"
            done
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatService.exe 0x004610FC dispatch-crosswalk/service/postparse-helper-pointer-refs.md || true
            python tools/find_td32_class_procedures.py analysis-input/EmwatService.exe TMainForm TIdHTTPServer TIdHTTPResponseInfo > dispatch-crosswalk/service/service-classes.md || true
            python tools/resolve_delphi_vmt_slots.py analysis-input/EmwatService.exe dispatch-crosswalk/service/service-vmt.md || true
            python tools/trace_delphi_interfaces.py analysis-input/EmwatService.exe dispatch-crosswalk/service/service-interfaces.md || true
            python tools/list_pe_imports.py analysis-input/EmwatService.exe dispatch-crosswalk/service/service-imports.md
            for address in 0x004873E0 0x0048740C 0x00487410 0x0048753C 0x004875CC 0x00487680 0x00487B9C; do
              python tools/scan_pe_pointer_refs.py analysis-input/EmwatService.exe "$address" "dispatch-crosswalk/service/import-${address}-pointer-refs.md" || true
            done
            python -m py_compile tools/scan_pe_call_refs.py tools/scan_pe_rel32_call_bytes.py tools/scan_pe_ff15_iat_refs.py
            for address in 0x004873E0 0x0048740C 0x00487410 0x0048753C 0x004875CC 0x00487680 0x00487B9C; do
              python tools/scan_pe_ff15_iat_refs.py analysis-input/EmwatService.exe "$address" "dispatch-crosswalk/service/${address}-ff15-iat-refs.md"
            done
            for address in 0x00401156 0x00401158 0x0040115E 0x00401160 0x004011B6 0x004011B8 0x00401462 0x00401464 0x00401D7A 0x00401D7C 0x00402172 0x00402174 0x00402352 0x00402354; do
              python tools/scan_pe_pointer_refs.py analysis-input/EmwatService.exe "$address" "dispatch-crosswalk/service/thunk-${address}-pointer-refs.md" || true
            done
            for address in 0x004610FC 0x0047E2D4 0x00401158 0x00401160 0x004011B8 0x00401464 0x00401D7C 0x00402174 0x00402354; do
              python tools/scan_pe_rel32_call_bytes.py analysis-input/EmwatService.exe "$address" "dispatch-crosswalk/service/${address}-rel32-call-candidates.md"
            done
            for address in 0x0046AA70 0x00471214 0x0046ADBC 0x0046A7A4 0x0047E2D4 0x004610FC; do
              python tools/scan_pe_call_refs.py analysis-input/EmwatService.exe "$address" "dispatch-crosswalk/service/${address}-all-callrefs.md"
            done
            python tools/inspect_delphi_vmt_address.py analysis-input/EmwatService.exe 0x00469A3C dispatch-crosswalk/service/ansi-string-dictionary-vmt.md || true
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatService.exe 0x00469A3C dispatch-crosswalk/service/ansi-string-dictionary-vmt-pointer-refs.md || true
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatService.exe 0x00470924 dispatch-crosswalk/service/ansi-string-dictionary-class-ref-pointer-refs.md || true
            python tools/trace_pe_range.py analysis-input/EmwatService.exe 0x0046A500 0x0046AE30 dispatch-crosswalk/service/parser-token-collection-full.md
            python tools/trace_pe_range.py analysis-input/EmwatService.exe 0x00470B38 0x00470CA3 dispatch-crosswalk/service/xml-token-loop-full.md
            python tools/trace_pe_range.py analysis-input/EmwatService.exe 0x0047E0EC 0x0047E218 dispatch-crosswalk/service/package-loader-full.md
            python tools/decode_pe_strings.py analysis-input/EmwatService.exe 0x00470CBC 0x00470CD0 0x00470CE4 0x00470CF8 0x00471050 0x0047E218 0x0047E248 0x0047E29C 0x0047C360 0x0047C37C 0x0047C3BC 0x0047C404 0x0047C450 0x0047C498 > dispatch-crosswalk/service/package-loader-and-parser-strings.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-service-dispatch-crosswalk
          path: dispatch-crosswalk/service/
          if-no-files-found: error

  bpl-method-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract authorized EMWAT analysis binaries
        if: hashFiles('EMWAT_Extracted.zip') != ''
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("EMWAT_Extracted.zip")
          out = Path("analysis-input")
          out.mkdir(exist_ok=True)
          wanted = {"EmwatMethods.bpl1", "EmwatService.exe", "EmwatAgent.exe"}
          with ZipFile(archive) as zf:
              found = {Path(name).name: name for name in zf.namelist() if Path(name).name in wanted}
              for basename in sorted(wanted & found.keys()):
                  (out / basename).write_bytes(zf.read(found[basename]))
                  print(f"Extracted {basename}: {(out / basename).stat().st_size} bytes")
          PY
      - name: Report missing analysis input
        if: hashFiles('analysis-input/EmwatMethods.bpl1') == ''
        run: echo "::notice::Skipped binary analysis because analysis-input/EmwatMethods.bpl1 is not present in this checkout."
      - uses: actions/setup-python@v5
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
      - name: Trace inherited method invocation and dispatch helpers
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
        shell: bash
        run: |
          mkdir -p dispatch-crosswalk/bpl
          for address in 0x0046C82C 0x0046DE84 0x0046E324 0x0046E3CC 0x005EE82C 0x004B7724 0x004B8A84 0x004D1148 0x004BCA88 0x004BFDB0 0x004C009C 0x004CB638; do
            name=${address#0x}
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/$name.md" 5000 ret
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/$name-td32.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/$name-callers.md" || true
          done
          python tools/find_td32_class_procedures.py analysis-input/EmwatMethods.bpl1 TEmwatMethod TEditWordDocument TScanDocument TWordViwer TWordViewer > dispatch-crosswalk/bpl/bpl-classes.md
          python tools/resolve_delphi_vmt_slots.py analysis-input/EmwatMethods.bpl1 dispatch-crosswalk/bpl/bpl-vmt.md
          python tools/trace_delphi_interfaces.py analysis-input/EmwatMethods.bpl1 dispatch-crosswalk/bpl/bpl-interfaces.md
          for item in "TEmwatMethod:0x0046ABFC" "TEditWordDocument:0x005ED764" "TScanDocument:0x005ED884" "TWordViwer:0x004B10A4" "TEDPController:0x004B0DFC"; do
            name=${item%%:*}
            address=${item#*:}
            python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/vmt-$name.md"
          done
          python tools/trace_td32_immediate_refs.py analysis-input/EmwatMethods.bpl1 0x005EE82C dispatch-crosswalk/bpl/editword-method-immediate-refs.md
          python tools/trace_td32_immediate_refs.py analysis-input/EmwatMethods.bpl1 0x005EEB48 dispatch-crosswalk/bpl/scandoc-method-immediate-refs.md
          for address in 0x0046ABFC 0x005ED764 0x005ED884 0x005ED99C 0x005EDAB4 0x005EDBD4 0x005EDCF4 0x005EDE0C 0x005EDF24 0x005EE04C; do
            name=${address#0x}
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/vmt-$name-pointer-refs.md"
            python tools/trace_td32_immediate_refs.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/vmt-$name-immediate-refs.md"
          done
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x005EE82C 0x005EEB48 dispatch-crosswalk/bpl/editword-performmethod-full.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x005EEB48 0x005EEDFC dispatch-crosswalk/bpl/scandoc-performmethod-full.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B7724 0x004B8A84 dispatch-crosswalk/bpl/wordviewer-loaddocument-full.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x005EE9F4 0x005EEA0C 0x005EEA88 0x005EEAA0 0x005EEABC 0x005EEAD4 0x005EEB0C 0x004B81E4 0x004B8220 0x004B8238 0x004B8280 0x004B82C4 0x004B832C 0x004B8348 0x004B8364 0x004B83A0 > dispatch-crosswalk/bpl/editword-load-document-strings.md
      - uses: actions/upload-artifact@v4
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
        with:
          name: emwat-bpl-dispatch-crosswalk
          path: dispatch-crosswalk/bpl/
          if-no-files-found: error

  word-controller-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract authorized EMWAT analysis binaries
        if: hashFiles('EMWAT_Extracted.zip') != ''
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("EMWAT_Extracted.zip")
          out = Path("analysis-input")
          out.mkdir(exist_ok=True)
          wanted = {"EmwatMethods.bpl1", "EmwatService.exe", "EmwatAgent.exe"}
          with ZipFile(archive) as zf:
              found = {Path(name).name: name for name in zf.namelist() if Path(name).name in wanted}
              for basename in sorted(wanted & found.keys()):
                  (out / basename).write_bytes(zf.read(found[basename]))
                  print(f"Extracted {basename}: {(out / basename).stat().st_size} bytes")
          PY
      - name: Report missing analysis input
        if: hashFiles('analysis-input/EmwatMethods.bpl1') == ''
        run: echo "::notice::Skipped binary analysis because analysis-input/EmwatMethods.bpl1 is not present in this checkout."
      - uses: actions/setup-python@v5
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
      - name: Trace controller notification and Word content getter
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
        shell: bash
        run: |
          mkdir -p dispatch-crosswalk/word
          for address in 0x004BB3B0 0x004CCBBC 0x004CD154 0x004CD54C 0x004CD9C0 0x004CDB54 0x004CDC2C 0x004CE030 0x004D23D8 0x004D1148 0x004B8A84 0x0042ABA0 0x0042BDF8 0x004309A4 0x00456DFC 0x004BCA88 0x004D281C 0x004AEBBC 0x004D2948; do
            name=${address#0x}
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/word/$name.md" 5000 ret
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/word/$name-td32.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/word/$name-callers.md" || true
          done
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B8A84 0x004BB3B0 dispatch-crosswalk/word/on-timer-autosave-full.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004BB3B0 0x004BB777 dispatch-crosswalk/word/on-controller-notify-full.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004CCBBC 0x004CCD5A dispatch-crosswalk/word/before-close-full.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004CD154 0x004CD54B dispatch-crosswalk/word/before-save-full.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004D23D8 0x004D281C dispatch-crosswalk/word/silent-save-emwat-doc-full.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x004BA304 0x004BA350 0x004BA368 0x004BA388 0x004BA3A8 0x004BA3C8 0x004BA414 0x004BA438 0x004BA4B4 0x004BA4CC 0x004BA4F8 0x004BA508 0x004CD374 0x004CD3C0 0x004CD3DC 0x004CD3F0 0x004CD40C 0x004CD4BC 0x004CD50C 0x004D26CC 0x004D2728 0x004D2758 0x004D2794 0x004D27A4 0x004D27B4 0x004D27C4 0x004CCD98 > dispatch-crosswalk/word/lifecycle-dialog-and-timer-strings.md
      - uses: actions/upload-artifact@v4
        if: hashFiles('analysis-input/EmwatMethods.bpl1') != ''
        with:
          name: emwat-word-controller-close-crosswalk
          path: dispatch-crosswalk/word/
          if-no-files-found: error
