name: Analyze EMWAT service and BPL dispatch crosswalk
on:
  push:
    paths:
      - '.github/workflows/analyze-emwat-dispatch-crosswalk.yml'
      - 'analysis-input/EmwatService.exe'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/trace_pe_target.py'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/find_td32_class_procedures.py'
      - 'tools/resolve_delphi_vmt_slots.py'
      - 'tools/trace_delphi_interfaces.py'
      - 'tools/inspect_delphi_vmt_address.py'
      - 'tools/trace_td32_immediate_refs.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/trace_pe_range.py'
      - 'tools/decode_pe_strings.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-request-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace service HTTP and XML dispatch chain
        shell: bash
        run: |
          mkdir -p dispatch-crosswalk/service
          if [ ! -f analysis-input/EmwatService.exe ]; then
            cat > dispatch-crosswalk/service/INPUT-NOT-PRESENT.md <<'EOF'
          # Service PE trace not run

          `analysis-input/EmwatService.exe` is not present in the public repository at this revision.
          The service addresses below are leads from earlier analysis notes, not newly verified traces:
          - 0x0047BF30 — MainForm HTTP command handler
          - 0x0047E0EC — invoke-route helper
          - 0x00470D00 / 0x00470B38 — XML ParseMethod wrapper/worker
          - 0x0046ADBC / 0x0046A7A4 — token dispatch/parser-record collection

          No service executable has been added or inferred. Add a sanitized, authorized analysis copy to `analysis-input/EmwatService.exe` before enabling this trace.
          EOF
            echo "EmwatService.exe absent; service trace intentionally skipped."
          else
            for address in 0x0047BF30 0x0047E0EC 0x00470D00 0x00470B38 0x0046ADBC 0x0046A7A4; do
              name=${address#0x}
              python tools/trace_pe_target.py analysis-input/EmwatService.exe "$address" "dispatch-crosswalk/service/$name.md" 5000 ret
              python tools/trace_td32_procedure.py analysis-input/EmwatService.exe "$address" "dispatch-crosswalk/service/$name-td32.md" || true
              python tools/trace_td32_callers.py analysis-input/EmwatService.exe "$address" "dispatch-crosswalk/service/$name-callers.md" || true
            done
            python tools/find_td32_class_procedures.py analysis-input/EmwatService.exe TMainForm TIdHTTPServer TIdHTTPResponseInfo > dispatch-crosswalk/service/service-classes.md
            python tools/resolve_delphi_vmt_slots.py analysis-input/EmwatService.exe dispatch-crosswalk/service/service-vmt.md
            python tools/trace_delphi_interfaces.py analysis-input/EmwatService.exe dispatch-crosswalk/service/service-interfaces.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-service-dispatch-crosswalk
          path: dispatch-crosswalk/service/
          if-no-files-found: error

  bpl-method-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace inherited method invocation and dispatch helpers
        shell: bash
        run: |
          mkdir -p dispatch-crosswalk/bpl
          for address in 0x0046C82C 0x0046DE84 0x0046E324 0x0046E3CC 0x005EE82C 0x004B7724 0x004B8A84 0x004D1148 0x004BCA88 0x004BFDB0 0x004C009C 0x004CB638; do
            name=${address#0x}
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/$name.md" 5000 ret
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/$name-td32.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/$name-callers.md" || true
          done
          python tools/find_td32_class_procedures.py analysis-input/EmwatMethods.bpl1 TEmwatMethod TEditWordDocument TScanDocument TWordViwer TWordViewer > dispatch-crosswalk/bpl/bpl-classes.md
          python tools/resolve_delphi_vmt_slots.py analysis-input/EmwatMethods.bpl1 dispatch-crosswalk/bpl/bpl-vmt.md
          python tools/trace_delphi_interfaces.py analysis-input/EmwatMethods.bpl1 dispatch-crosswalk/bpl/bpl-interfaces.md
          for item in "TEmwatMethod:0x0046ABFC" "TEditWordDocument:0x005ED764" "TScanDocument:0x005ED884" "TWordViwer:0x004B10A4" "TEDPController:0x004B0DFC"; do
            name=${item%%:*}
            address=${item#*:}
            python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/vmt-$name.md"
          done
          python tools/trace_td32_immediate_refs.py analysis-input/EmwatMethods.bpl1 0x005EE82C dispatch-crosswalk/bpl/editword-method-immediate-refs.md
          python tools/trace_td32_immediate_refs.py analysis-input/EmwatMethods.bpl1 0x005EEB48 dispatch-crosswalk/bpl/scandoc-method-immediate-refs.md
          for address in 0x0046ABFC 0x005ED764 0x005ED884 0x005ED99C 0x005EDAB4 0x005EDBD4 0x005EDCF4 0x005EDE0C 0x005EDF24 0x005EE04C; do
            name=${address#0x}
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/vmt-$name-pointer-refs.md"
            python tools/trace_td32_immediate_refs.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/bpl/vmt-$name-immediate-refs.md"
          done
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x005EE82C 0x005EEB48 dispatch-crosswalk/bpl/editword-performmethod-full.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x005EEB48 0x005EEDFC dispatch-crosswalk/bpl/scandoc-performmethod-full.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B7724 0x004B8A84 dispatch-crosswalk/bpl/wordviewer-loaddocument-full.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x005EE9F4 0x005EEA0C 0x005EEA88 0x005EEAA0 0x005EEABC 0x005EEAD4 0x005EEB0C 0x004B81E4 0x004B8220 0x004B8238 0x004B8280 0x004B82C4 0x004B832C 0x004B8348 0x004B8364 0x004B83A0 > dispatch-crosswalk/bpl/editword-load-document-strings.md
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-bpl-dispatch-crosswalk
          path: dispatch-crosswalk/bpl/
          if-no-files-found: error

  word-controller-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace controller notification and Word content getter
        shell: bash
        run: |
          mkdir -p dispatch-crosswalk/word
          for address in 0x004BB3B0 0x004CCBBC 0x004CD154 0x004CD54C 0x004CD9C0 0x004CDB54 0x004CDC2C 0x004CE030 0x004D23D8 0x004D1148 0x004B8A84 0x0042ABA0 0x0042BDF8 0x004309A4 0x00456DFC; do
            name=${address#0x}
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/word/$name.md" 5000 ret
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/word/$name-td32.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$address" "dispatch-crosswalk/word/$name-callers.md" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-word-controller-close-crosswalk
          path: dispatch-crosswalk/word/
          if-no-files-found: error
