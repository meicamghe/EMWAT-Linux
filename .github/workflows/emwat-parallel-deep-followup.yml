name: EMWAT parallel deep follow-up lanes
on:
  push:
    paths:
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/list_td32_symbols.py'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/trace_td32_procedure_skipdata.py'
      - 'tools/trace_pe_range.py'
      - 'tools/trace_pe_target.py'
      - 'tools/dump_pe_delphi_pointer_table.py'
      - '.github/workflows/emwat-parallel-deep-followup.yml'
      - 'native/**'
      - 'python/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emwat-deep-followup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner-result-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Resolve result-image class methods from TD32 symbols
        shell: bash
        run: |
          mkdir -p deep-followup/scanner-result
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            TResultImage TSetOfSinglePageImages TSetOfMultiPageImages \
            GetScanFilePath GetResponseFileName ShiftSerial \
            > deep-followup/scanner-result/symbol-index.md
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          source = Path("deep-followup/scanner-result/symbol-index.md").read_text()
          rows = []
          for line in source.splitlines():
              cols = [part.strip() for part in line.strip().strip("|").split("|")]
              if len(cols) != 5 or not cols[0].startswith("`0x"):
                  continue
              address = cols[0].strip("`")
              name = cols[4].strip("`")
              if any(term in name.casefold() for term in (
                  "tresultimage", "tsetofsinglepageimages", "tsetofmultipageimages",
                  "getscanfilepath", "getresponsefilename", "shiftserial"
              )):
                  rows.append((address, name))
          rows = sorted(set(rows))
          if not rows:
              raise SystemExit("No result-image TD32 symbols resolved")
          (Path("deep-followup/scanner-result/selected-symbols.txt")).write_text(
              "\n".join(f"{address} {name}" for address, name in rows) + "\n"
          )
          for address, name in rows:
              safe = address.replace("0x", "")
              subprocess.run([
                  sys.executable, "tools/trace_td32_procedure.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/scanner-result/procedure-{safe}.md"
              ], check=True)
              subprocess.run([
                  sys.executable, "tools/trace_td32_callers.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/scanner-result/callers-{safe}.md"
              ], check=True)
          PY
      - name: Inspect global scan-state table and paging references
        run: |
          python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x0062A7F0 \
            deep-followup/scanner-result/state-table-pointer-refs.md
          mkdir -p deep-followup/scanner-result
          set +e
          python tools/dump_pe_delphi_pointer_table.py analysis-input/EmwatMethods.bpl1 0x0062A7F0 4 \
            deep-followup/scanner-result/next-page-state-table.md \
            >deep-followup/scanner-result/next-page-state-table.stdout.txt \
            2>deep-followup/scanner-result/next-page-state-table.stderr.txt
          status=$?
          printf 'exit_status=%s\n' "$status" > deep-followup/scanner-result/next-page-state-table.status.txt
          if [ "$status" -ne 0 ]; then
            echo "Static table inspection failed; see stderr artifact. Continue collecting independent traces."
          fi
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x004F2558 \
            deep-followup/scanner-result/get-next-page-control-flow.md
      - name: Trace TScanCommand request methods and GetNextPage callers
        shell: bash
        run: |
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 TScanCommand \
            > deep-followup/scanner-result/scan-command-symbols.md
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          source = Path("deep-followup/scanner-result/scan-command-symbols.md").read_text()
          rows = []
          for line in source.splitlines():
              cols = [part.strip() for part in line.strip().strip("|").split("|")]
              if len(cols) != 5 or not cols[0].startswith("`0x"):
                  continue
              address, name = cols[0].strip("`"), cols[4].strip("`")
              rows.append((address, name))
          rows = sorted(set(rows))
          (Path("deep-followup/scanner-result/scan-command-selected-symbols.txt")).write_text(
              "\n".join(f"{address} {name}" for address, name in rows) + "\n"
          )
          for address, name in rows:
              safe = address.replace("0x", "")
              subprocess.run([
                  sys.executable, "tools/trace_td32_procedure_skipdata.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/scanner-result/scan-command-{safe}.md"
              ], check=True)
              subprocess.run([
                  sys.executable, "tools/trace_td32_callers.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/scanner-result/scan-command-callers-{safe}.md"
              ], check=True)
          PY
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004F2558 \
            deep-followup/scanner-result/get-next-page-callers.md
      - name: Decode scanner XML constants and trace Fax response dispatch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import pefile

          path = Path("analysis-input/EmwatMethods.bpl1")
          blob = path.read_bytes()
          pe = pefile.PE(data=blob, fast_load=True)
          image_base = pe.OPTIONAL_HEADER.ImageBase
          traces = [
              Path("deep-followup/scanner-result/scan-command-004F2B18.md"),
              Path("deep-followup/scanner-result/scan-command-004F2C4C.md"),
              Path("deep-followup/scanner-result/scan-command-004F22E4.md"),
          ]
          addresses = set()
          for trace in traces:
              if trace.exists():
                  addresses.update(int(value, 16) for value in re.findall(r"0x[0-9A-Fa-f]{6,8}", trace.read_text()))
          rows = []
          for va in sorted(addresses):
              rva = va - image_base
              if rva < 0:
                  continue
              try:
                  offset = pe.get_offset_from_rva(rva)
              except Exception:
                  continue
              if offset < 0 or offset >= len(blob):
                  continue
              section = next((s for s in pe.sections if s.VirtualAddress <= rva < s.VirtualAddress + max(s.Misc_VirtualSize, s.SizeOfRawData)), None)
              if section is None:
                  continue
              sample = blob[offset:offset + 160]
              candidates = []
              for encoding in ("utf-16le", "utf-8", "cp1252"):
                  try:
                      text = sample.decode(encoding, errors="strict").split("\x00", 1)[0]
                  except UnicodeError:
                      continue
                  if len(text) >= 2:
                      printable = sum(ch.isprintable() for ch in text) / len(text)
                      if printable >= 0.85 and any(ch.isalpha() for ch in text):
                          candidates.append((len(text), encoding, text))
              if candidates:
                  _, encoding, value = max(candidates)
                  rows.append((va, section.Name.rstrip(b"\x00").decode("ascii", "replace"), offset, encoding, value))
          out = ["# Candidate strings referenced by TScanCommand XML parsing traces", "",
                 "Candidates are byte-decoded from immediate addresses in the TD32 traces; validate each against the surrounding procedure before assigning a protocol field name.", ""]
          for va, section, offset, encoding, value in rows:
              out.append(f"- VA 0x{va:08X} ({section}, raw 0x{offset:08X}, {encoding}): {value!r}")
          Path("deep-followup/scanner-result/request-xml-string-candidates.md").write_text("\n".join(out) + "\n")
          PY
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x005EEB48 \
            deep-followup/scanner-result/fax-perform-method.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x005EEB48 \
            deep-followup/scanner-result/fax-perform-method-callers.md
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x004F32F4 \
            deep-followup/scanner-result/request-state-helper.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004F32F4 \
            deep-followup/scanner-result/request-state-helper-callers.md
      - name: Trace fax temporary-path helper and result serial dispatch
        run: |
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x00454B9C \
            deep-followup/scanner-result/fax-temp-path-helper.md
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x00454B9C \
            deep-followup/scanner-result/fax-temp-path-helper-skipdata.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x00454B9C \
            deep-followup/scanner-result/fax-temp-path-helper-callers.md
          python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x00454B9C \
            deep-followup/scanner-result/fax-temp-path-helper-pointer-refs.md
      - name: Decode exact scanner XML property and value constants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pefile

          path = Path("analysis-input/EmwatMethods.bpl1")
          blob = path.read_bytes()
          pe = pefile.PE(data=blob, fast_load=True)
          base = pe.OPTIONAL_HEADER.ImageBase
          addresses = [
              0x004F2BF8, 0x004F2C0C, 0x004F302E, 0x004F31D8,
              0x004F31E2, 0x004F31F8, 0x004F3210, 0x004F3224,
              0x004F3238, 0x004F3578, 0x004F358C, 0x004F35C0,
              0x004F3614, 0x004F366C, 0x004F36C0,
          ]
          out = [
              "# Targeted scanner XML constants",
              "",
              "These addresses are immediate operands passed to XML/interface helper routines in TScanCommand procedures. Values are decoded directly from the PE at the specified VAs; the surrounding call sites must still be used to determine each property's exact semantic role.",
              "",
          ]
          for va in addresses:
              try:
                  off = pe.get_offset_from_rva(va - base)
              except Exception as exc:
                  out.append(f"- 0x{va:08X}: unmapped ({exc})")
                  continue
              raw = blob[off:off + 192]
              value = None
              for enc in ("utf-16le", "cp1252", "utf-8"):
                  try:
                      candidate = raw.decode(enc, errors="strict").split("\x00", 1)[0]
                  except UnicodeError:
                      continue
                  if len(candidate) >= 1 and all(ch.isprintable() for ch in candidate):
                      if enc == "utf-16le" or any(ch.isalpha() for ch in candidate):
                          value = (enc, candidate)
                          break
              out.append(f"- VA 0x{va:08X}, raw 0x{off:08X}: {value[0] + ': ' + repr(value[1]) if value else 'no printable string at this VA'}")
          Path("deep-followup/scanner-result/request-xml-targeted-constants.md").write_text("\n".join(out) + "\n")
          PY
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x004E9D5C \
            deep-followup/scanner-result/xml-value-conversion-helper.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004E9D5C \
            deep-followup/scanner-result/xml-value-conversion-helper-callers.md
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x004F32F4 \
            deep-followup/scanner-result/request-state-helper.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004F32F4 \
            deep-followup/scanner-result/request-state-helper-callers.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-deep-scanner-result-ownership
          path: deep-followup/scanner-result/
          if-no-files-found: error

  imageen-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Resolve ImageEn acquisition, import and print procedures
        shell: bash
        run: |
          mkdir -p deep-followup/imageen
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            TfrmImageTools InsertPicture ScanPicture DoPrinting UpdatePrintPreview \
            > deep-followup/imageen/symbol-index.md
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          source = Path("deep-followup/imageen/symbol-index.md").read_text()
          rows = []
          for line in source.splitlines():
              cols = [part.strip() for part in line.strip().strip("|").split("|")]
              if len(cols) != 5 or not cols[0].startswith("`0x"):
                  continue
              address, name = cols[0].strip("`"), cols[4].strip("`")
              if any(term in name.casefold() for term in (
                  "insertpicture", "scanpicture", "doprinting",
                  "updateprintpreview", "acquire"
              )):
                  rows.append((address, name))
          rows = sorted(set(rows))
          if not rows:
              raise SystemExit("No ImageEn caller procedures resolved")
          (Path("deep-followup/imageen/selected-symbols.txt")).write_text(
              "\n".join(f"{address} {name}" for address, name in rows) + "\n"
          )
          for address, name in rows:
              safe = address.replace("0x", "")
              subprocess.run([
                  sys.executable, "tools/trace_td32_procedure.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/imageen/procedure-{safe}.md"
              ], check=True)
              subprocess.run([
                  sys.executable, "tools/trace_td32_callers.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/imageen/callers-{safe}.md"
              ], check=True)
          PY
      - name: Disassemble ImageEn helper region without TD32 bounds
        run: |
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B0100 0x004B0240 \
            deep-followup/imageen/imageen-helper-region-004B0100-004B0240.md
      - name: Resolve ImageEn import-thunk targets
        run: |
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B012C \
            deep-followup/imageen/import-004B012C-acquire.md 8
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B0154 \
            deep-followup/imageen/import-004B0154.md 8
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B01A4 \
            deep-followup/imageen/import-004B01A4.md 8
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B01F4 \
            deep-followup/imageen/import-004B01F4.md 8
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B01FC \
            deep-followup/imageen/import-004B01FC.md 8
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B0204 \
            deep-followup/imageen/import-004B0204.md 8
      - name: Resolve ImageEn acquisition helper thunk
        run: |
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x004B0154 \
            deep-followup/imageen/acquisition-helper-004B0154.md
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x004B0154 \
            deep-followup/imageen/acquisition-helper-004B0154-skipdata.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004B0154 \
            deep-followup/imageen/acquisition-helper-004B0154-callers.md
          python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x004B0154 \
            deep-followup/imageen/acquisition-helper-004B0154-pointer-refs.md
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x004B01A4 \
            deep-followup/imageen/helper-004B01A4.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004B01A4 \
            deep-followup/imageen/helper-004B01A4-callers.md
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x004B01F4 \
            deep-followup/imageen/helper-004B01F4.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004B01F4 \
            deep-followup/imageen/helper-004B01F4-callers.md
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x004B01FC \
            deep-followup/imageen/helper-004B01FC.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004B01FC \
            deep-followup/imageen/helper-004B01FC-callers.md
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x004B0204 \
            deep-followup/imageen/helper-004B0204.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004B0204 \
            deep-followup/imageen/helper-004B0204-callers.md
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x00404F3C \
            deep-followup/imageen/helper-00404F3C.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x00404F3C \
            deep-followup/imageen/helper-00404F3C-callers.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-deep-imageen-acquisition
          path: deep-followup/imageen/
          if-no-files-found: error

  word-printer-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Resolve hidden print thread and Word/GAM dispatch methods
        shell: bash
        run: |
          mkdir -p deep-followup/word-printer
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            THidePrintingThread TCreateTiff SeparteImages GetPrinterName \
            SetPrinterForTiffout CheckPrinterPaused Zanprinter@Finalization Get_ActivePrinter Set_ActivePrinter \
            > deep-followup/word-printer/symbol-index.md
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          source = Path("deep-followup/word-printer/symbol-index.md").read_text()
          rows = []
          for line in source.splitlines():
              cols = [part.strip() for part in line.strip().strip("|").split("|")]
              if len(cols) != 5 or not cols[0].startswith("`0x"):
                  continue
              address, name = cols[0].strip("`"), cols[4].strip("`")
              if any(term in name.casefold() for term in (
                  "thideprintingthread", "separteimages", "getprintername",
                  "setprinterfortiffout", "checkprinterpaused", "zanprinter@finalization", "get_activeprinter",
                  "set_activeprinter"
              )):
                  rows.append((address, name))
          rows = sorted(set(rows))
          if not rows:
              raise SystemExit("No Word/GAM print-thread symbols resolved")
          (Path("deep-followup/word-printer/selected-symbols.txt")).write_text(
              "\n".join(f"{address} {name}" for address, name in rows) + "\n"
          )
          for address, name in rows:
              safe = address.replace("0x", "")
              subprocess.run([
                  sys.executable, "tools/trace_td32_procedure.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/word-printer/procedure-{safe}.md"
              ], check=True)
              subprocess.run([
                  sys.executable, "tools/trace_td32_callers.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/word-printer/callers-{safe}.md"
              ], check=True)
              subprocess.run([
                  sys.executable, "tools/scan_pe_pointer_refs.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/word-printer/pointers-{safe}.md"
              ], check=True)
              subprocess.run([
                  sys.executable, "tools/trace_td32_procedure_skipdata.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/word-printer/procedure-skipdata-{safe}.md"
              ], check=True)
          PY
      - name: Resolve Word close and archive helper candidates
        run: |
          for target in 0x004BCA88 0x004AEBBC 0x004CD154; do
            safe=${target#0x}
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 "$target" \
              "deep-followup/word-printer/helper-$safe.md"
            python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 "$target" \
              "deep-followup/word-printer/helper-$safe-skipdata.md"
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$target" \
              "deep-followup/word-printer/helper-$safe-callers.md"
          done
      - name: Resolve Word close callback containing GetXmlFieldInfo call
        run: |
          python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 0x004CCCC9 \
            deep-followup/word-printer/word-app-document-before-close.md
      - name: Trace Word viewer event registration candidates
        shell: bash
        run: |
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 TWordViwer \
            > deep-followup/word-printer/word-viewer-symbols.md
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          source = Path("deep-followup/word-printer/word-viewer-symbols.md").read_text()
          rows = []
          for line in source.splitlines():
              cols = [part.strip() for part in line.strip().strip("|").split("|")]
              if len(cols) != 5 or not cols[0].startswith("`0x"):
                  continue
              address, name = cols[0].strip("`"), cols[4].strip("`")
              folded = name.casefold()
              if any(term in folded for term in (
                  "create", "destroy", "bctr", "bdtr", "connect", "ontmrautosave",
                  "wordappdocumentbeforeclose", "wordappdocumentbeforesave",
                  "beforeclose", "beforesave"
              )):
                  rows.append((address, name))
          rows = sorted(set(rows))
          (Path("deep-followup/word-printer/word-viewer-event-candidates.txt")).write_text(
              "\n".join(f"{address} {name}" for address, name in rows) + "\n"
          )
          for address, name in rows:
              safe = address.replace("0x", "")
              subprocess.run([
                  sys.executable, "tools/trace_td32_procedure_skipdata.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/word-printer/word-viewer-event-{safe}.md"
              ], check=True)
              subprocess.run([
                  sys.executable, "tools/trace_td32_callers.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/word-printer/word-viewer-event-callers-{safe}.md"
              ], check=True)
              subprocess.run([
                  sys.executable, "tools/scan_pe_pointer_refs.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/word-printer/word-viewer-event-pointers-{safe}.md"
              ], check=True)
          PY
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 FillImgFldsForPrint \
            > deep-followup/word-printer/fill-img-fields-symbols.md
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          source = Path("deep-followup/word-printer/fill-img-fields-symbols.md").read_text()
          rows = []
          for line in source.splitlines():
              cols = [part.strip() for part in line.strip().strip("|").split("|")]
              if len(cols) == 5 and cols[0].startswith("`0x"):
                  rows.append((cols[0].strip("`"), cols[4].strip("`")))
          rows = sorted(set(rows))
          (Path("deep-followup/word-printer/fill-img-fields-selected.txt")).write_text(
              "\n".join(f"{address} {name}" for address, name in rows) + "\n"
          )
          for address, name in rows:
              safe = address.replace("0x", "")
              subprocess.run([
                  sys.executable, "tools/trace_td32_procedure_skipdata.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/word-printer/fill-img-fields-{safe}.md"
              ], check=True)
              subprocess.run([
                  sys.executable, "tools/trace_td32_callers.py",
                  "analysis-input/EmwatMethods.bpl1", address,
                  f"deep-followup/word-printer/fill-img-fields-callers-{safe}.md"
              ], check=True)
          PY
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B8C80 0x004B8CE0 \
            deep-followup/word-printer/on-timer-pointer-context.md
      - name: Resolve registered Word event target methods
        run: |
          for target in 0x004D00AC 0x004CE030 0x004CD154 0x004CD54C 0x004CD9C0; do
            safe=${target#0x}
            python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 "$target" \
              "deep-followup/word-printer/event-target-$safe.md"
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$target" \
              "deep-followup/word-printer/event-target-callers-$safe.md"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-deep-word-printer-thread
          path: deep-followup/word-printer/
          if-no-files-found: error

  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native image dependencies
        run: sudo apt-get update && sudo apt-get install -y libpng-dev libjpeg-dev libtiff-dev libsane-dev
      - name: Build and run native regression suite
        run: |
          cmake -S native -B native/build-deep-followup -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build-deep-followup --parallel 2
          ctest --test-dir native/build-deep-followup --output-on-failure
      - name: Run Python bridge regression suite
        run: |
          python -m pip install -e ./python pytest
          python -m pytest -q python/tests
