name: EMWAT GAM printer installation branch follow-up
on:
  push:
    paths:
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/list_td32_symbols.py'
      - 'tools/trace_td32_procedure_skipdata.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/trace_pe_range.py'
      - 'tools/decode_pe_strings.py'
      - '.github/workflows/emwat-printer-driver-install-followup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emwat-printer-driver-install-followup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  printer-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace GAM printer install and readiness methods
        shell: bash
        run: |
          mkdir -p printer-driver-install
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            InstallZanPrinter GetZanInstallDir GetPrinterName CheckPrinterPaused \
            Finalization AddPrinter AddPrinterDriver DeletePrinterDriver \
            OpenPrinterA GetPrinterA ClosePrinter EnumPrintersA \
            > printer-driver-install/symbol-index.md
          for target in \
            0x0047CAF0 0x0047CC6C 0x0047CC94 0x0047D238 \
            0x0047D448 0x0047D8BC 0x00401240 \
            0x00404494 0x00402910 0x00402754 0x00402818; do
            safe=${target#0x}
            python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 "$target" \
              "printer-driver-install/procedure-$safe.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$target" \
              "printer-driver-install/callers-$safe.md" || true
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 "$target" \
              "printer-driver-install/pointers-$safe.md" || true
          done
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x00401200 0x00401280 \
            printer-driver-install/runtime-helper-00401200-00401280.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x00404480 0x004044A0 \
            printer-driver-install/shell-execute-helper-00404480-004044A0.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x00402900 0x00402940 \
            printer-driver-install/ini-helper-00402900-00402940.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 \
            0x0047CF90 0x0047CFB8 0x0047CFC4 0x0047CFDC 0x0047CFEC \
            0x0047D00C 0x0047D02C 0x0047D048 0x0047D3CC 0x0047D3DC \
            0x0047D3F8 0x0047D408 0x0047D434 \
            0x0047D678 0x0047D688 0x0047D69C 0x0047D6AC 0x0047D6B8 \
            0x0047D6D4 0x0047D6EC 0x0047D704 0x0047D708 0x0047D72C \
            0x0047D740 0x0047D74C 0x0047D764 0x0047D770 0x0047D778 \
            0x0047D790 0x0047D798 0x0047D7B0 0x0047D7B4 0x0047D7C8 \
            0x0047D800 0x0047D828 0x0047D840 0x0047D85C 0x0047D86C \
            0x0047D880 0x0047D8A0 > printer-driver-install/printer-strings.md
          python - <<'PY'
          from pathlib import Path
          import pefile
          blob=Path("analysis-input/EmwatMethods.bpl1").read_bytes()
          pe=pefile.PE(data=blob,fast_load=False)
          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"]])
          base=pe.OPTIONAL_HEADER.ImageBase
          out=["# GAM printer install constants and Winspool imports",""]
          for va in (0x0047CC64,0x0047CC60,0x0047CC68,0x0047CC70,0x0047CC94):
              try:
                  off=pe.get_offset_from_rva(va-base)
                  raw=blob[off:off+128]
                  out.append(f"## bytes at 0x{va:08X} (file 0x{off:08X})")
                  out.append(f"- raw: {raw.hex(' ')}")
                  for enc in ("utf-16le","utf-8","latin1"):
                      s=raw.decode(enc,"ignore").split(chr(0),1)[0]
                      if s and sum(ch.isprintable() for ch in s)>2:
                          out.append(f"- {enc}: {s!r}")
              except Exception as exc: out.append(f"- error: {exc}")
              out.append("")
          out.append("## Helper IAT target")
          out.append(f"- IAT 0x0062ED38: {next((v for k,v in imports.items() if k == 0x0062ED38), 'NOT FOUND')}")
          out.append("")
          out.append("## Relevant printer, registry, shell and GDI imports")
          for desc in getattr(pe,"DIRECTORY_ENTRY_IMPORT",[]):
              dll=desc.dll.decode("ascii","replace")
              for imp in desc.imports:
                  name=imp.name.decode("ascii","replace") if imp.name else f"ordinal_{imp.ordinal}"
                  if ("spool" in dll.lower() or "printer" in name.lower() or
                      name.lower().startswith("reg") or name.lower() in {
                          "getprivateprofilestringw","writeprivateprofilestringw",
                          "getmodulefilenamew","getsystemdirectoryw","getwindowsdirectoryw",
                          "shellexecutew","shellexecutea","createprocessw","winexec"
                      }):
                      out.append(f"- {dll}!{name} — IAT VA 0x{imp.address:08X}")
          Path("printer-driver-install/constants-and-imports.md").write_text("\n".join(out)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-printer-driver-install-followup
          path: printer-driver-install/
          if-no-files-found: error
