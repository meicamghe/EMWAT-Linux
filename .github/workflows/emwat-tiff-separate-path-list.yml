name: EMWAT TIFF page path list and output naming
on:
  push:
    paths:
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/trace_td32_procedure_skipdata.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/trace_pe_range.py'
      - '.github/workflows/emwat-tiff-separate-path-list.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emwat-tiff-separate-path-list-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-path-list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace list construction and output path helpers
        shell: bash
        run: |
          mkdir -p tiff-path-list
          for target in 0x004A0148 0x004A0BA8 0x004B7724 0x0040414C 0x00454B9C 0x0047D238 0x0047D8BC 0x0047D448; do
            safe=${target#0x}
            python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 "$target" \
              "tiff-path-list/procedure-$safe.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$target" \
              "tiff-path-list/callers-$safe.md" || true
          done
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004A06A0 0x004A0A68 \
            tiff-path-list/tiff-inline-range.md
          python - <<'PY'
          from pathlib import Path
          import pefile
          blob=Path("analysis-input/EmwatMethods.bpl1").read_bytes()
          pe=pefile.PE(data=blob,fast_load=True)
          base=pe.OPTIONAL_HEADER.ImageBase
          addresses=[0x004A06A8,0x004A06DC,0x004A071C,0x004A0734,0x004A07C0,
                     0x004A07D8,0x004A07F4,0x004A08E4,0x004A08F4,0x004A0960,
                     0x004A09C0,0x004A0A34]
          out=["# TIFF path/list inline constants",""]
          for va in addresses:
              try:
                  off=pe.get_offset_from_rva(va-base); raw=blob[off:off+128]
                  out += [f"## 0x{va:08X}",f"- bytes: {raw[:64].hex(' ')}"]
                  for enc in ("utf-16le","latin1"):
                      s=raw.decode(enc,"ignore").split("\0",1)[0]
                      if s and sum(ch.isprintable() for ch in s)>3: out.append(f"- {enc}: {s!r}")
              except Exception as exc: out.append(f"0x{va:08X}: {exc}")
          Path("tiff-path-list/decoded-constants.md").write_text("\n".join(out)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-tiff-page-path-list
          path: tiff-path-list/
          if-no-files-found: error
