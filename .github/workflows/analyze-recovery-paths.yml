name: Analyze EMWAT autosave and recovery paths
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-recovery-paths.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/find_td32_class_procedures.py'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/decode_pe_strings.py'
      - 'tools/inspect_pe_va.py'
      - 'tools/scan_pe_pointer_refs.py'
permissions:
  contents: read
jobs:
  autosave-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Find autosave path, cleanup, and temporary-file helpers
        run: |
          mkdir -p recovery-path-analysis/helpers recovery-path-analysis/form-data
          python tools/find_td32_class_procedures.py analysis-input/EmwatMethods.bpl1 euGetAutoSavePath euGetAutoSavePass DoClearOldAutoSaveFiles euClearOldAutoSaveFiles euGetLocalAppDataPath euGetTempPath euGetWinTempPath DeleteTempRAW euClearTempFiles T7zInArchive T7zOutArchive > recovery-path-analysis/helpers/autosave-helper-index.md
          python tools/find_td32_class_procedures.py analysis-input/EmwatMethods.bpl1 T7zInArchive > recovery-path-analysis/helpers/sevenzip-inarchive-method-index.md
          python tools/find_td32_class_procedures.py analysis-input/EmwatMethods.bpl1 T7zOutArchive > recovery-path-analysis/helpers/sevenzip-outarchive-method-index.md
          test -s recovery-path-analysis/helpers/autosave-helper-index.md
      - name: Trace each helper implementation and callers
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          source = pathlib.Path("recovery-path-analysis/helpers/autosave-helper-index.md").read_text(encoding="utf-8")
          rows = []
          for line in source.splitlines():
              if not line.startswith("|") or "Decorated procedure" in line or "|---" in line:
                  continue
              parts = [part.strip() for part in line.strip("|").split("|")]
              if len(parts) < 5:
                  continue
              decorated = parts[1].strip("`")
              match = re.search(r"0x([0-9A-Fa-f]{8})", parts[2])
              if match:
                  rows.append((decorated, match.group(1)))
          index = ["# Autosave/recovery helper traces", ""]
          for decorated, va in rows:
              safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", decorated)[:110]
              trace = f"recovery-path-analysis/helpers/{va}-{safe}.md"
              callers = f"recovery-path-analysis/helpers/{va}-{safe}-callers.md"
              subprocess.run([sys.executable, "tools/trace_td32_procedure.py", "analysis-input/EmwatMethods.bpl1", "0x" + va, trace], check=True)
              subprocess.run([sys.executable, "tools/trace_td32_callers.py", "analysis-input/EmwatMethods.bpl1", "0x" + va, callers], check=True)
              index.append(f"- `0x{va}` — `{decorated}` — {trace}; callers: {callers}")
          pathlib.Path("recovery-path-analysis/helpers/trace-index.md").write_text("\n".join(index) + "\n", encoding="utf-8")
          PY
      - name: Trace SevenZip archive reader and writer methods
        run: |
          mkdir -p recovery-path-analysis/sevenzip
          python - <<'PY'
          import pathlib, re, subprocess, sys
          out = pathlib.Path("recovery-path-analysis/sevenzip")
          index = ["# SevenZip archive class method traces", ""]
          for source_name in (
              "recovery-path-analysis/helpers/sevenzip-inarchive-method-index.md",
              "recovery-path-analysis/helpers/sevenzip-outarchive-method-index.md",
          ):
              source = pathlib.Path(source_name)
              if not source.exists():
                  continue
              text = source.read_text(encoding="utf-8")
              for line in text.splitlines():
                  if not line.startswith("|") or "Decorated procedure" in line or "|---" in line:
                      continue
                  parts = [part.strip() for part in line.strip("|").split("|")]
                  if len(parts) < 5:
                      continue
                  module, decorated = parts[0], parts[1].strip("`")
                  match = re.search(r"0x([0-9A-Fa-f]{8})", parts[2])
                  if not match:
                      continue
                  va = match.group(1)
                  safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", decorated)[:100]
                  trace = out / f"{va}-{safe}.md"
                  callers = out / f"{va}-{safe}-callers.md"
                  subprocess.run([sys.executable, "tools/trace_td32_procedure.py",
                                  "analysis-input/EmwatMethods.bpl1", "0x" + va, str(trace)], check=True)
                  subprocess.run([sys.executable, "tools/trace_td32_callers.py",
                                  "analysis-input/EmwatMethods.bpl1", "0x" + va, str(callers)], check=True)
                  index.append(f"- {module} — 0x{va} — {decorated}: {trace}; callers: {callers}")
          (out / "index.md").write_text("\\n".join(index) + "\\n", encoding="utf-8")
          PY
      - name: Decode form data constants and helper call targets
        run: |
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x005EC1F8 0x005EC49C 0x005EC4B8 0x005EC4F4 0x005EC508 0x005EC51C 0x005EC52C 0x005EBD18 0x005EBD3C 0x005EBDA0 0x005EBD54 0x00456DCC 0x00456C78 0x00456FEC 0x0044A92C 0x0044A940 0x0044A950 0x0044A968 0x0044A434 0x0044A44C 0x0044A554 0x0044A56C 0x0044B060 0x0044B094 0x0044B0A8 0x0044B0B4 0x0044B0DC 0x00454B24 0x00454B44 0x00454B54 0x00454B6C > recovery-path-analysis/form-data/recovery-form-constants.md
          for target in 00467088 00454A58 00456DDC 00456F00 004563A8 004565DC 004555D8 0045574C 004525B4 004525DE 00452736 0045274C 004527B8 00451F44 00452ED8 004525BC 004525EC 004525F4 004525FC; do
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target recovery-path-analysis/form-data/helper-$target.md
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target recovery-path-analysis/form-data/helper-$target-callers.md
          done
          for target in 0044A59C 004027F8 00452BBC 00452E80 00404734 00453950 004043BC 004026B4 004026A4 00402684 00402744 00402A38 00402A80 00402A78 004044A4 0040449C 0040264C 004027F8 00404494 00404344 004032B8 00403330 004033A0 0044A59C; do
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target recovery-path-analysis/form-data/api-$target.md 24
          done
          for target in 00452BBC 00452E80 0062A824 0062A858 00452558 00453860 00452FB8 0045375C 004543C4 004547DC 0062FBB8; do
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target recovery-path-analysis/form-data/refs-$target.md
          done
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0062A824 --before 0x20 --after 0x80 > recovery-path-analysis/form-data/global-62A824.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0062A858 --before 0x20 --after 0x80 > recovery-path-analysis/form-data/global-62A858.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00452558 --before 0x20 --after 0x80 > recovery-path-analysis/form-data/class-452558.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x004525B0 --before 0x20 --after 0x180 > recovery-path-analysis/form-data/vmt-4525B0.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0045275B --before 0x20 --after 0x100 > recovery-path-analysis/form-data/typeinfo-45275B.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004525B0 0x004527C0 recovery-path-analysis/form-data/archive-class-vmt-and-typeinfo.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x005EB828 recovery-path-analysis/form-data/auto-save-delete-handler.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x005EB828 recovery-path-analysis/form-data/auto-save-delete-handler-callers.md
          for target in 0044A998 004563A8 004565DC 004555D8; do
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target recovery-path-analysis/form-data/helper-$target.md
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target recovery-path-analysis/form-data/helper-$target-callers.md
          done
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-recovery-path-analysis
          path: recovery-path-analysis/
