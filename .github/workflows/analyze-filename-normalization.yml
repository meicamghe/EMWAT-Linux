name: Analyze EMWAT filename normalization
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-filename-normalization.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/decode_pe_strings.py'
      - 'tools/trace_pe_target.py'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
concurrency:
  group: filename-normalization-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  filename-normalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Decode filename validation and construction constants
        run: |
          mkdir -p filename-analysis
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x00457148 0x00457160 0x0045702C 0x00457044 0x00454C80 0x00627E8C 0x00627E90 0x004B8220 0x004B8238 0x004B832C 0x004B8348 0x004B8364 0x004B83A0 > filename-analysis/string-constants.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0045702C --before 0x10 --after 0x40 > filename-analysis/constant-45702C.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00457044 --before 0x10 --after 0x40 > filename-analysis/constant-457044.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00454C80 --before 0x10 --after 0x40 > filename-analysis/constant-454C80.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00627E8C --before 0x20 --after 0x80 > filename-analysis/global-627E8C.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x00627E90 --before 0x20 --after 0x80 > filename-analysis/global-627E90.md
      - name: Trace filename helper internals
        run: |
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x00457050 filename-analysis/Emwatutils-Finalization.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x00454B9C filename-analysis/Emwatutils-euGetASFileName.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0044A998 filename-analysis/helper-44A998.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x00403278 filename-analysis/helper-403278.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x00401378 filename-analysis/helper-401378.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x00401370 filename-analysis/helper-401370.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x00403270 filename-analysis/helper-403270.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x004032C0 filename-analysis/helper-4032C0.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x004028A0 filename-analysis/helper-4028A0.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x00454B9C filename-analysis/euGetASFileName-callers.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x00457050 filename-analysis/Finalization-callers.md
      - name: Resolve Delphi string and path helper thunk targets
        run: |
          mkdir -p filename-analysis/helper-thunks
          for target in 00401200 00401208 00401218 00401220 00401238 00401240 00401248 00401258 00401270 004012F8 00401370 00401378 00401390 00403270 00403278 004032C0 004032C8 00403378; do
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target filename-analysis/helper-thunks/$target.md 180 ret
          done
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-filename-normalization-analysis
          path: filename-analysis/
