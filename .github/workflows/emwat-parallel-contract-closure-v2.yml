name: EMWAT parallel contract closure v2
on:
  push:
    paths:
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/list_td32_symbols.py'
      - 'tools/trace_td32_procedure_skipdata.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/trace_pe_range.py'
      - '.github/workflows/emwat-parallel-contract-closure-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emwat-contract-closure-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sevenzip-output-callback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace SevenZip constructors and callback object
        shell: bash
        run: |
          mkdir -p closure-v2/sevenzip
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            T7zOutArchive T7zInArchive T7zPlugin CryptoGetTextPassword2 \
            SetPassword SetOperationResult SetPropertie euResetMemory euUnArchive \
            > closure-v2/sevenzip/symbol-index.md
          for target in 0x00452C10 0x004543B0 0x004543C4 0x004547B0 0x004547DC 0x00454800 0x00456F00 0x00453860 0x0062FBB8; do
            safe=${target#0x}
            python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/sevenzip/procedure-$safe.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/sevenzip/callers-$safe.md" || true
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/sevenzip/pointers-$safe.md" || true
          done
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x00452B80 0x00452D00 \
            closure-v2/sevenzip/plugin-constructor-range.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-closure-v2-sevenzip
          path: closure-v2/sevenzip/
          if-no-files-found: error

  word-beforeclose-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace Word event callbacks and registration crosswalk
        shell: bash
        run: |
          mkdir -p closure-v2/word-close
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            WordAppDocumentBeforeClose WordAppDocumentBeforeSave \
            WordAppDocumentBeforePrint WordAppDocumentBeforePrintBGPrint \
            WordAppNewDocument WordAppWindowActivate OnTmrAutoSave LoadOptions \
            > closure-v2/word-close/symbol-index.md
          for target in 0x004B8A84 0x004CCBBC 0x004CD154 0x004CD54C 0x004CD9C0 0x004CDC2C 0x004CE030 0x004D00AC; do
            safe=${target#0x}
            python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/word-close/procedure-$safe.md"
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/word-close/callers-$safe.md"
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/word-close/pointers-$safe.md"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-closure-v2-word-beforeclose
          path: closure-v2/word-close/
          if-no-files-found: error

  scanner-maxfilesize-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace scanner size and resolution conversions
        shell: bash
        run: |
          mkdir -p closure-v2/scanner
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            TXMLConstraintsType Get_MaxFileSize Set_MaxFileSize \
            TScanCommand DoRequest GetNextPage VerifyConstraints Finalization \
            TGearImgProc GearType \
            > closure-v2/scanner/symbol-index.md
          for target in 0x004F22E4 0x004F2558 0x004F2C4C 0x004F32F4 0x004EEF30 0x004EAD84 0x004EAE08; do
            safe=${target#0x}
            python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/scanner/procedure-$safe.md"
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/scanner/callers-$safe.md"
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/scanner/pointers-$safe.md"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-closure-v2-scanner-maxfilesize
          path: closure-v2/scanner/
          if-no-files-found: error

  tiff-output-file-io:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace TIFF worker and file-output import callers
        shell: bash
        run: |
          mkdir -p closure-v2/tiff
          for target in 0x004A0148 0x004A0E88 0x004A5014 0x004A5EA8 0x004A5F68 0x004A8FCC 0x004A8E58 0x004D2F44; do
            safe=${target#0x}
            python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/tiff/procedure-$safe.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/tiff/callers-$safe.md" || true
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 "$target" \
              "closure-v2/tiff/pointers-$safe.md" || true
          done
          python - <<'PY'
          from pathlib import Path
          import struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          blob=Path("analysis-input/EmwatMethods.bpl1").read_bytes()
          pe=pefile.PE(data=blob,fast_load=False)
          base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
          wanted={"createfilea","createfilew","writefile","movefilea","movefilew",
                  "copyfilea","copyfilew","deletefilea","deletefilew",
                  "getfileattributesa","getfileattributesw","setendoffile",
                  "getfilesize","getfilesizeex","findfirstfilea","findfirstfilew",
                  "findnextfilea","findnextfilew","closehandle"}
          out=["# TIFF/output file API import callers",""]
          for entry in getattr(pe,"DIRECTORY_ENTRY_IMPORT",[]):
              dll=entry.dll.decode("ascii","replace")
              for imp in entry.imports:
                  if not imp.name: continue
                  name=imp.name.decode("ascii","replace")
                  if name.casefold() not in wanted: continue
                  iat=imp.address
                  pattern=b"\\xff\\x25"+struct.pack("<I",iat)
                  thunks=[]
                  for sec in pe.sections:
                      if not (sec.Characteristics & 0x20000000): continue
                      st,en=sec.PointerToRawData,sec.PointerToRawData+sec.SizeOfRawData
                      pos=st
                      while True:
                          pos=blob.find(pattern,pos,en)
                          if pos<0: break
                          thunks.append(base+sec.VirtualAddress+(pos-st)); pos+=1
                  out.append(f"## {dll}!{name} IAT 0x{iat:08X}")
                  for thunk in sorted(set(thunks)):
                      out.append(f"- thunk 0x{thunk:08X}")
                      refs=[]
                      for sec in pe.sections:
                          if not (sec.Characteristics & 0x20000000): continue
                          raw=blob[sec.PointerToRawData:sec.PointerToRawData+sec.SizeOfRawData]
                          va=base+sec.VirtualAddress
                          for ins in md.disasm(raw,va):
                              if ins.mnemonic in ("call","jmp") and ins.operands and ins.operands[0].type==2 and ins.operands[0].imm==thunk:
                                  refs.append(ins.address)
                      for site in refs: out.append(f"  - {site:08X}")
          Path("closure-v2/tiff/file-api-callers.md").write_text("\n".join(out)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-closure-v2-tiff-output
          path: closure-v2/tiff/
          if-no-files-found: error
