name: Native image core
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-core.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install codec development libraries
        run: sudo apt-get update && sudo apt-get install -y libpng-dev libjpeg-dev libtiff-dev
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build --parallel 2
      - name: Test
        run: ctest --test-dir native/build --output-on-failure
