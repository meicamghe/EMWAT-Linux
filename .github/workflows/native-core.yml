name: Native image core
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-core.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install codec development libraries
        run: sudo apt-get update && sudo apt-get install -y libpng-dev libjpeg-dev libtiff-dev libsane-dev
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build --parallel 2
      - name: Test
        run: ctest --test-dir native/build --output-on-failure
      - name: Install to staging prefix
        env:
          DESTDIR: ${{ runner.temp }}/emwat-native-stage
        run: |
          cmake --install native/build --prefix /usr
          test -f "$DESTDIR/usr/lib/libemwat_image_core.a"
          test -f "$DESTDIR/usr/include/emwat/image_document.hpp"
          test -f "$DESTDIR/usr/include/emwat/scanner.hpp"

  sanitizer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install codec development libraries
        run: sudo apt-get update && sudo apt-get install -y libpng-dev libjpeg-dev libtiff-dev libsane-dev
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S native -B native/build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build native/build-sanitized --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir native/build-sanitized --output-on-failure

  deb-package-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and package tools
        run: sudo apt-get update && sudo apt-get install -y libpng-dev libjpeg-dev libtiff-dev libsane-dev dpkg-dev
      - name: Build initial Debian package
        run: |
          cmake -S native -B native/package-v1 -DCMAKE_BUILD_TYPE=Release -DEMWAT_PACKAGE_VERSION=0.1.0
          cmake --build native/package-v1 --parallel 2
          cpack --config native/package-v1/CPackConfig.cmake
      - name: Build upgrade Debian package
        run: |
          cmake -S native -B native/package-v2 -DCMAKE_BUILD_TYPE=Release -DEM WAT_PACKAGE_VERSION=0.1.1
          cmake --build native/package-v2 --parallel 2
          cpack --config native/package-v2/CPackConfig.cmake
      - name: Install, upgrade, and remove package
        run: |
          first_package="$(find native/package-v1 -maxdepth 1 -name '*.deb' -print -quit)"
          second_package="$(find native/package-v2 -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$first_package"
          test -n "$second_package"
          sudo dpkg -i "$first_package"
          test "$(dpkg-query -W -f='${Version}' emwat-native-core-dev)" = "0.1.0-1"
          test -f /usr/lib/libemwat_image_core.a
          test -f /usr/include/emwat/scanner.hpp
          sudo dpkg -i "$second_package"
          test "$(dpkg-query -W -f='${Version}' emwat-native-core-dev)" = "0.1.1-1"
          test -f /usr/lib/libemwat_image_core.a
          sudo dpkg -r emwat-native-core-dev
          if dpkg-query -W emwat-native-core-dev >/dev/null 2>&1; then
            echo "package remains installed after removal" >&2
            exit 1
          fi
          test ! -e /usr/lib/libemwat_image_core.a
          test ! -e /usr/include/emwat/scanner.hpp
