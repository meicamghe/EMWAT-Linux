name: Analyze EMWAT Word request lifecycle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-word-request-lifecycle.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/trace_td32_immediate_refs.py'
      - 'tools/trace_pe_range.py'
      - 'tools/trace_pe_target.py'
      - 'tools/decode_pe_strings.py'
      - 'tools/scan_td32_class_field_refs.py'
permissions:
  contents: read
jobs:
  request-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Decode Word BeforeSave prompt and close dispatch
        run: |
          mkdir -p request-lifecycle-analysis/beforesave
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x004CD154 request-lifecycle-analysis/beforesave/WordAppDocumentBeforeSave.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004CD154 0x004CD364 request-lifecycle-analysis/beforesave/BeforeSave-control-flow.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004CD154 request-lifecycle-analysis/beforesave/BeforeSave-callers.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x004CCBBC request-lifecycle-analysis/beforesave/WordAppDocumentBeforeClose.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004CCBBC request-lifecycle-analysis/beforesave/BeforeClose-callers.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x004CD374 0x004CD3C0 0x004CD3DC 0x004CD3F0 0x004CD40C 0x004CD41C 0x004CD42C 0x004CD4BC 0x004CD50C > request-lifecycle-analysis/beforesave/BeforeSave-prompt-strings.md
      - name: Trace remaining OnTmrAutoSave code and wait/message loop candidates
        run: |
          mkdir -p request-lifecycle-analysis/autosave
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004BA058 0x004BB3AF request-lifecycle-analysis/autosave/OnTmrAutoSave-tail.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x004BA058 request-lifecycle-analysis/autosave/OnTmrAutoSave-tail-procedure.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004B8A84 request-lifecycle-analysis/autosave/OnTmrAutoSave-callers.md
          python tools/trace_td32_immediate_refs.py analysis-input/EmwatMethods.bpl1 0x004B8A84 request-lifecycle-analysis/autosave/OnTmrAutoSave-refs.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x004BA304 0x004BA350 0x004BA368 0x004BA388 0x004BA3A8 0x004BA3C8 0x004BA414 0x004BA438 0x004BA5EC > request-lifecycle-analysis/autosave/OnTmrAutoSave-strings.md
      - name: Resolve lifecycle COM, thread, and message helpers
        run: |
          mkdir -p request-lifecycle-analysis/helpers
          for target in 00404B84 00440950 0043F360 00441C68 00440A68 0044ABE4 00403ED0 00403ED8 00401478 004013B8 00403550 004011D0; do
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/helpers/$target.md 220 ret
          done
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004B7724 request-lifecycle-analysis/helpers/LoadDocument-callers.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004B7F9C request-lifecycle-analysis/helpers/LoadDocument-response-write-callers.md
      - name: Trace complete LoadDocument request blocking and response path
        run: |
          mkdir -p request-lifecycle-analysis/loaddocument
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B7724 0x004B8A84 request-lifecycle-analysis/loaddocument/LoadDocument-complete-range.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B7724 0x004B7DE1 request-lifecycle-analysis/loaddocument/LoadDocument-entry-and-file-create.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B7DE1 0x004B809D request-lifecycle-analysis/loaddocument/LoadDocument-read-and-response.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B809D 0x004B8A84 request-lifecycle-analysis/loaddocument/LoadDocument-post-response-tail.md
          for target in 004B7724 004B7A58 004B7DE1 004B7F9C 004B8080; do
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/loaddocument/procedure-$target.md
            python tools/trace_td32_immediate_refs.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/loaddocument/refs-$target.md
          done
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004B7724 request-lifecycle-analysis/loaddocument/LoadDocument-direct-callers.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x004B7F9C request-lifecycle-analysis/loaddocument/LoadDocument-response-writer-callers.md
      - name: Trace response XML builder and returned document payload
        shell: bash
        run: |
          mkdir -p request-lifecycle-analysis/response-builder
          for target in 00468198 00468150 004011B8 004011B0 00401260 00401370 00401398 00402B6C; do
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/response-builder/target-$target.md 1400 ret
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/response-builder/procedure-$target.md || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/response-builder/callers-$target.md || true
          done
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B7F74 request-lifecycle-analysis/response-builder/LoadDocument-response-constructor-callsite.md 500 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x004B7F83 request-lifecycle-analysis/response-builder/LoadDocument-response-write-tail.md 500 ret
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B7F31 0x004B7FD8 request-lifecycle-analysis/response-builder/LoadDocument-response-builder-range.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x004B88FC 0x004B8978 0x004B89B8 0x004B89FC 0x004B8A50 > request-lifecycle-analysis/response-builder/response-builder-strings.md
      - name: Resolve LoadDocument and OnTmrAutoSave helper behavior
        run: |
          mkdir -p request-lifecycle-analysis/remaining-helpers
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B8A84 0x004BA058 request-lifecycle-analysis/remaining-helpers/OnTmrAutoSave-main-range.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B8F30 0x004BA058 request-lifecycle-analysis/remaining-helpers/OnTmrAutoSave-late-range.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x004B9900 0x004B9A80 request-lifecycle-analysis/remaining-helpers/OnTmrAutoSave-timer-registration.md
          for target in 004B999A 004BA058 004D2EC8 004BB3B0; do
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/remaining-helpers/target-$target.md 1800 ret
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/remaining-helpers/procedure-$target.md || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/remaining-helpers/callers-$target.md || true
          done
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x004BB6CC 0x004BB754 0x004BB76C > request-lifecycle-analysis/remaining-helpers/controller-notify-strings.md
          for target in 00468150 00468198 004735C4 00403248 004032A8 00403368 00404F04 004A0148; do
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/remaining-helpers/procedure-$target.md
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/remaining-helpers/callers-$target.md
          done
      - name: Resolve TWordViwer state field ownership and close release
        shell: bash
        run: |
          mkdir -p request-lifecycle-analysis/viewer-state
          python tools/scan_td32_class_field_refs.py analysis-input/EmwatMethods.bpl1 TWordViwer request-lifecycle-analysis/viewer-state/TWordViwer-field-offsets.md --offsets 0x58 0x5E 0x5F 0x7C 0x80 0x88 0x90 0x98 0xA0 0xEC
          for target in 004D08B4 004D0D24 00445B10 00455108 004B9AE8 004B9B38 004CD154 004CD2FF 004CD31C; do
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/viewer-state/procedure-$target.md || true
            python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/viewer-state/target-$target.md 1600 ret
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target request-lifecycle-analysis/viewer-state/callers-$target.md || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-word-request-lifecycle-analysis
          path: request-lifecycle-analysis/
