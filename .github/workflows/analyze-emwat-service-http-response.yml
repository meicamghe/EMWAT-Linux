name: Analyze EMWAT service HTTP response path
on:
  push:
    paths:
      - 'EMWAT_Extracted.zip'
      - '.github/workflows/analyze-emwat-service-http-response.yml'
      - 'tools/trace_pe_target.py'
      - 'tools/list_td32_symbols.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-http-response:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Extract and inspect the local service executable
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, zipfile
          archive = zipfile.ZipFile("EMWAT_Extracted.zip")
          matches = [n for n in archive.namelist() if pathlib.PurePosixPath(n).name.lower() == "emwatservice.exe"]
          if not matches:
              raise SystemExit("EmwatService.exe not found in EMWAT_Extracted.zip")
          target = pathlib.Path("service-http-analysis/EmwatService.exe")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(archive.read(matches[0]))
          print(f"Extracted service binary metadata: {matches[0]}, {target.stat().st_size} bytes")
          PY
      - name: Find HTTP response and EditWordDocument string references
        run: |
          python - <<'PY'
          import pathlib, re, struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          path = pathlib.Path("service-http-analysis/EmwatService.exe")
          pe = pefile.PE(str(path), fast_load=False)
          out = []
          out.append(f"ImageBase: 0x{pe.OPTIONAL_HEADER.ImageBase:08X}")
          out.append(f"EntryPoint: 0x{pe.OPTIONAL_HEADER.ImageBase + pe.OPTIONAL_HEADER.AddressOfEntryPoint:08X}")
          out.append("## Sections")
          for s in pe.sections:
              out.append(f"- {s.Name.rstrip(bytes([0])).decode(errors='replace')}: RVA=0x{s.VirtualAddress:X} VA=0x{pe.OPTIONAL_HEADER.ImageBase+s.VirtualAddress:X} raw={s.SizeOfRawData} virtual={s.Misc_VirtualSize}")
          out.append("## Imports")
          for entry in getattr(pe, "DIRECTORY_ENTRY_IMPORT", []):
              for imp in entry.imports:
                  name = imp.name.decode(errors="replace") if imp.name else f"ordinal_{imp.ordinal}"
                  out.append(f"- {entry.dll.decode(errors='replace')}!{name}")
          needles = [
              b"EditWordDocument", b"response-word", b"ContentText", b"WriteContent",
              b"TIdHTTPResponseInfo", b"heartbeat", b"TickTack", b"invoke=",
              b"wordConfig", b"wordBody", b"signData", b"application/msword",
              b"Request XML is not valid", b"Request Doc is Empty",
              b"OnCommandGet", b"OnCommandOther", b"OnCommandPost", b"OnCommandHead",
              b"TIdHTTPServer", b"TIdCustomHTTPServer", b"TIdHTTPRequestInfo",
              b"TIdHTTPResponseInfo", b"TIdContext", b"DefaultPort", b"Heartbeat",
              b"TEmwatService", b"TService", b"CommandGet", b"CommandOther",
          ]
          text_sections = [s for s in pe.sections if b".text" in s.Name]
          md = Cs(CS_ARCH_X86, CS_MODE_32)
          out.append("## Protocol strings and absolute code references")
          for needle in needles:
              found = []
              for sec in pe.sections:
                  data = sec.get_data()
                  start = 0
                  while True:
                      pos = data.find(needle, start)
                      if pos < 0: break
                      va = pe.OPTIONAL_HEADER.ImageBase + sec.VirtualAddress + pos
                      found.append((sec, pos, va))
                      start = pos + 1
              out.append(f"### {needle.decode(errors='replace')}: {len(found)} occurrence(s)")
              for sec, pos, va in found[:12]:
                  out.append(f"- string VA=0x{va:08X} section={sec.Name.rstrip(bytes([0])).decode(errors='replace')} offset=0x{pos:X}")
                  ptr = struct.pack("<I", va)
                  for code_sec in text_sections:
                      code = code_sec.get_data()
                      xrefs = []
                      at = 0
                      while True:
                          hit = code.find(ptr, at)
                          if hit < 0: break
                          xrefs.append(hit); at = hit + 1
                      for hit in xrefs[:8]:
                          base = max(0, hit - 48)
                          end = min(len(code), hit + 80)
                          start_va = pe.OPTIONAL_HEADER.ImageBase + code_sec.VirtualAddress + base
                          out.append(f"  - xref at VA=0x{pe.OPTIONAL_HEADER.ImageBase+code_sec.VirtualAddress+hit:08X}")
                          for ins in md.disasm(code[base:end], start_va):
                              out.append(f"    {ins.address:08X}: {ins.mnemonic} {ins.op_str}")
          pathlib.Path("service-http-analysis/service-http-response-trace.md").write_text("\n".join(out), encoding="utf-8")
          PY
      - name: Attempt TD32 symbol indexing when debug records are present
        shell: bash
        run: |
          python tools/list_td32_symbols.py service-http-analysis/EmwatService.exe \
            TIdHTTPResponseInfo TIdHTTPServer TEditWordDocument TScanDocument \
            > service-http-analysis/service-td32-symbols.md || true
      - name: Resolve Indy HTTP server and response-info VMTs
        run: |
          python - <<'PY'
          import pathlib, re, struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          path = pathlib.Path("service-http-analysis/EmwatService.exe")
          blob = path.read_bytes()
          pe = pefile.PE(data=blob, fast_load=False)
          image = pe.OPTIONAL_HEADER.ImageBase
          def raw_to_va(raw):
              for sec in pe.sections:
                  if sec.PointerToRawData <= raw < sec.PointerToRawData + sec.SizeOfRawData:
                      return image + sec.VirtualAddress + raw - sec.PointerToRawData
              return None
          def va_to_raw(va):
              rva = va - image
              for sec in pe.sections:
                  if sec.VirtualAddress <= rva < sec.VirtualAddress + max(sec.Misc_VirtualSize, sec.SizeOfRawData):
                      delta = rva - sec.VirtualAddress
                      if delta < sec.SizeOfRawData: return sec.PointerToRawData + delta
              return None
          def u32(raw):
              return struct.unpack_from("<I", blob, raw)[0] if raw is not None and raw + 4 <= len(blob) else None
          def readva(va):
              return u32(va_to_raw(va))
          names = ("TIdHTTPServer", "TIdCustomHTTPServer", "TIdHTTPResponseInfo",
                   "TIdHTTPRequestInfo", "TIdContext", "TIdTCPServer",
                   "TIdHTTPHeaderInfo", "TIdHTTPResponse")
          out = ["# Indy HTTP VMT inspection", "", f"- PE32 ImageBase: 0x{image:08X}", ""]
          md = Cs(CS_ARCH_X86, CS_MODE_32)
          for name in names:
              encoded = name.encode("ascii")
              candidates = set()
              for m in re.finditer(rb"(?<![A-Za-z0-9_])" + re.escape(encoded) + rb"(?![A-Za-z0-9_])", blob):
                  for shortstring_raw in (m.start() - 1, m.start()):
                      if shortstring_raw < 0: continue
                      name_va = raw_to_va(shortstring_raw)
                      if name_va is not None:
                          candidates.add(name_va)
                          if name_va >= 2: candidates.add(name_va - 2)
              vmt_hits = set()
              for pos in range(0, len(blob) - 4, 4):
                  value = struct.unpack_from("<I", blob, pos)[0]
                  if value in candidates:
                      field_va = raw_to_va(pos)
                      if field_va is None: continue
                      vmt = field_va + 56
                      if readva(vmt - 88) == vmt:
                          size = readva(vmt - 52)
                          if size is not None and 8 <= size <= 0x10000:
                              vmt_hits.add((vmt, size))
              out.append(f"## {name}")
              if not vmt_hits:
                  out.append("- No VMT candidate passed self-pointer and instance-size checks.")
                  out.append("")
                  continue
              for vmt, size in sorted(vmt_hits):
                  out.append(f"- VMT 0x{vmt:08X}; instance size 0x{size:X}")
                  for slot in range(0, 0x80, 4):
                      target = readva(vmt + slot)
                      if target is None: continue
                      raw = va_to_raw(target)
                      if raw is None: 
                          out.append(f"  - +0x{slot:02X}: 0x{target:08X} (unmapped)")
                          continue
                      insns = list(md.disasm(blob[raw:raw+32], target))[:5]
                      desc = "; ".join(f"{x.mnemonic} {x.op_str}" for x in insns)
                      out.append(f"  - +0x{slot:02X}: 0x{target:08X} — {desc or 'no decode'}")
              out.append("")
          pathlib.Path("service-http-analysis/indy-http-vmt.md").write_text("\n".join(out), encoding="utf-8")
          PY
      - name: Trace HTTP server virtual methods and pointer references
        shell: bash
        run: |
          pids=()
          for spec in "0045E85C 2200" "0045E464 1400" "00438874 1000" "0043898C 1000" "004389D4 1000" "00438AE0 1200" "00439184 1000" "0041E8A4 1200" "0041E910 1200" "0041E970 1200" "0040AED8 1200" "00438A2C 2600" "0045E03C 1200" "004391B0 1200" "004595A8 1600" "00460840 1800" "00459AB0 1200" "004594AC 1600" "00460E48 2000" "00458AE4 1400" "00458FCC 1400" "00458EB8 1200" "00460308 1400" "00460378 1400"; do
            (
              set -e
              set -- $spec
              python tools/trace_pe_target.py service-http-analysis/EmwatService.exe 0x$1 service-http-analysis/method-$1.md $2 ret
              python tools/scan_pe_pointer_refs.py service-http-analysis/EmwatService.exe 0x$1 service-http-analysis/refs-$1.md
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Decode request-handler dispatch strings
        run: |
          python tools/decode_pe_strings.py service-http-analysis/EmwatService.exe \
            0x00459B84 0x0045E4DC 0x0047C61B 0x0045AFC1 \
            0x0045B044 0x0045BEAF 0x0045C35F 0x0045C166 \
            > service-http-analysis/http-handler-strings.md
      - name: Trace Delphi interface tables for HTTP server classes
        run: |
          python tools/trace_delphi_interfaces.py service-http-analysis/EmwatService.exe \
            service-http-analysis/service-http-interfaces.md
      - name: Resolve HTTP request and response virtual method slots
        run: |
          python - <<'PY'
          import pathlib, struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          path = pathlib.Path("service-http-analysis/EmwatService.exe")
          blob = path.read_bytes()
          pe = pefile.PE(data=blob, fast_load=False)
          image = pe.OPTIONAL_HEADER.ImageBase
          vmt_map = {
              "TIdHTTPRequestInfo": 0x0045B704,
              "TIdHTTPResponseInfo": 0x0045BDE8,
              "TIdCustomHTTPServer": 0x0045D024,
              "TIdHTTPServer": 0x00461CFC,
          }
          def raw(va):
              rva = va - image
              for sec in pe.sections:
                  if sec.VirtualAddress <= rva < sec.VirtualAddress + max(sec.Misc_VirtualSize, sec.SizeOfRawData):
                      delta = rva - sec.VirtualAddress
                      if delta < sec.SizeOfRawData: return sec.PointerToRawData + delta
              return None
          md = Cs(CS_ARCH_X86, CS_MODE_32)
          out = ["# Indy HTTP request/response VMT method inventory", ""]
          targets = set()
          for name, vmt in vmt_map.items():
              out.append(f"## {name} — VMT 0x{vmt:08X}")
              for slot in range(0, 0x180, 4):
                  r = raw(vmt + slot)
                  if r is None or r + 4 > len(blob): break
                  target = struct.unpack_from("<I", blob, r)[0]
                  tr = raw(target)
                  if tr is None: continue
                  targets.add(target)
                  insns = list(md.disasm(blob[tr:tr+24], target))[:4]
                  desc = "; ".join(f"{x.mnemonic} {x.op_str}" for x in insns)
                  out.append(f"- +0x{slot:02X} → 0x{target:08X}: {desc}")
              out.append("")
          out.append("## Unique method targets")
          out.extend(f"- 0x{x:08X}" for x in sorted(targets))
          pathlib.Path("service-http-analysis/http-vmt-methods.md").write_text("\n".join(out), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-service-http-response-analysis
          path: service-http-analysis/*.md
