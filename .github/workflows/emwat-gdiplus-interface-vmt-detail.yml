name: EMWAT GDI+ TIFF save dispatch follow-up
on:
  push:
    paths:
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/list_td32_symbols.py'
      - 'tools/trace_td32_procedure_skipdata.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/scan_pe_pointer_refs.py'
      - '.github/workflows/emwat-gdiplus-interface-vmt-detail.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emwat-gdiplus-interface-vmt-detail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gdiplus-class-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Resolve corrected TGPImage and encoder metadata references
        shell: bash
        run: |
          mkdir -p gdiplus-followup/class-interface
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            TGPImage TGPEncoderParameters EncoderParameters GdipSaveImageToFile \
            GdipSaveImageToStream GdipSaveAddImage GdipSaveAdd SeparteImages \
            > gdiplus-followup/class-interface/symbol-index.md
          for target in 0x00483FA4 0x00484780 0x00483F4C 0x00484728; do
            safe=${target#0x}
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 "$target" \
              "gdiplus-followup/class-interface/pointers-$safe.md" || true
          done
          python - <<'PY'
          from pathlib import Path
          import pefile
          blob=Path("analysis-input/EmwatMethods.bpl1").read_bytes()
          pe=pefile.PE(data=blob,fast_load=True)
          base=pe.OPTIONAL_HEADER.ImageBase
          out=["# Corrected Delphi GDI+ class/interface metadata bytes","",
               "Raw DWORDs are recorded as data only; do not interpret these blocks as flat VMTs.",""]
          for name,va,size in (("TGPEncoderParameters",0x00483FA4,0x180),
                               ("TGPImage",0x00484780,0x180),
                               ("TGPEncoderParameters class slot",0x00483F4C,0x40),
                               ("TGPImage class slot",0x00484728,0x40)):
              out.append(f"## {name} @ 0x{va:08X}")
              try:
                  off=pe.get_offset_from_rva(va-base)
                  raw=blob[off:off+size]
                  for pos in range(0,len(raw)-3,4):
                      value=int.from_bytes(raw[pos:pos+4],"little")
                      out.append(f"- +0x{pos:03X}: 0x{value:08X}")
              except Exception as exc: out.append(f"- read error: {exc}")
              out.append("")
          Path("gdiplus-followup/class-interface/class-metadata-dwords.md").write_text("\n".join(out)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-gdiplus-class-interface-followup
          path: gdiplus-followup/class-interface/
          if-no-files-found: error

  tiff-page-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace actual TGPImage Save/SaveAdd wrappers and resolve PE import targets
        shell: bash
        run: |
          mkdir -p gdiplus-followup/tiff-page-save
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            SeparteImages THidePrintingThread TGPImage Save SaveAdd \
            TGPEncoderParameters Add GdipSaveImageToFile GdipSaveImageToStream \
            GdipSaveAddImage GdipSaveAdd \
            > gdiplus-followup/tiff-page-save/symbol-index.md
          for target in \
            0x004A0148 0x004A0E88 \
            0x004908AC 0x004908E4 0x00490950 0x004909B4 \
            0x00490A18 0x00490A84 \
            0x0048F308 0x0048F328 0x0048F364 0x0048F410 \
            0x0048F514 0x0048F68C 0x0048F780 \
            0x00481C5C 0x00481C64 0x00481C6C 0x00481C74 \
            0x00481C7C 0x00481D14; do
            safe=${target#0x}
            python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 "$target" \
              "gdiplus-followup/tiff-page-save/procedure-$safe.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$target" \
              "gdiplus-followup/tiff-page-save/callers-$safe.md" || true
          done
          python - <<'PY'
          from pathlib import Path
          import pefile
          blob=Path("analysis-input/EmwatMethods.bpl1").read_bytes()
          pe=pefile.PE(data=blob,fast_load=False)
          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"]])
          base=pe.OPTIONAL_HEADER.ImageBase
          imports={}
          for desc in getattr(pe,"DIRECTORY_ENTRY_IMPORT",[]):
              dll=desc.dll.decode("ascii","replace")
              for imp in desc.imports:
                  name=imp.name.decode("ascii","replace") if imp.name else f"ordinal_{imp.ordinal}"
                  imports[imp.address]=f"{dll}!{name}"
          out=["# GDI+ code thunk to actual PE import map","",
               "This maps each 6-byte JMP [IAT] thunk to the import address and imported symbol; TD32 names are not treated as authoritative.","",
               "## Parsed GDI+ imports"]
          for slot,symbol in sorted(imports.items()):
              if "gdip" in symbol.lower():
                  out.append(f"- {symbol} — IAT VA 0x{slot:08X}")
          out.append("")
          for va in (0x00481C5C,0x00481C64,0x00481C6C,0x00481C74,0x00481C7C,0x00481D14):
              try:
                  off=pe.get_offset_from_rva(va-base)
                  raw=blob[off:off+6]
                  iat=int.from_bytes(raw[2:6],"little") if raw[:2]==b"\xff\x25" else None
                  out.append(f"## thunk 0x{va:08X}")
                  out.append(f"- bytes: {raw.hex(' ')}")
                  if iat is not None:
                      out.append(f"- IAT VA: 0x{iat:08X}")
                      out.append(f"- imported symbol: {imports.get(iat,'NOT FOUND IN IMPORT DIRECTORY')}")
                  else:
                      out.append("- not a simple JMP [absolute IAT] thunk")
              except Exception as exc:
                  out.append(f"- error: {exc}")
              out.append("")
          Path("gdiplus-followup/tiff-page-save/pe-import-thunk-map.md").write_text("\n".join(out)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-gdiplus-tiff-page-save-followup
          path: gdiplus-followup/tiff-page-save/
          if-no-files-found: error
