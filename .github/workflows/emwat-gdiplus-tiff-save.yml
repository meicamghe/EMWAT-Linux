name: EMWAT GDI+ TIFF save-path analysis
on:
  push:
    paths:
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/list_td32_symbols.py'
      - 'tools/trace_td32_procedure_skipdata.py'
      - 'tools/trace_td32_callers.py'
      - '.github/workflows/emwat-gdiplus-tiff-save.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emwat-gdiplus-tiff-save-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gdiplus-save-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Resolve GDI+ image save methods and imports
        shell: bash
        run: |
          mkdir -p gdiplus-save
          python tools/list_td32_symbols.py analysis-input/EmwatMethods.bpl1 \
            TGPImage TGPBitmap TGPEncoderParameters TGPImageFormat \
            SaveToFile SaveToStream SaveImage SaveAdd Save \
            > gdiplus-save/symbol-index.md
          python - <<'PY'
          from pathlib import Path
          import struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          blob=Path("analysis-input/EmwatMethods.bpl1").read_bytes()
          pe=pefile.PE(data=blob,fast_load=False)
          base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
          wanted={"gdipsaveimagetofile","gdipsaveimagetofileicm","gdipsaveimagetostream",
                  "gdipsaveadd","gdipsaveaddimage","gdipcreatebitmapfromfile",
                  "gdiploadimagefromfile","gdipgetimageencoders","gdipgetimageencodersize",
                  "gdipcreatebitmapfromstream","gdipdisposeimage","gdipgetimagewidth",
                  "gdipgetimageheight","gdipgetimagegraphicscontext"}
          out=["# GDI+ import thunk and callsite scan",""]
          for entry in getattr(pe,"DIRECTORY_ENTRY_IMPORT",[]):
              dll=entry.dll.decode("ascii","replace")
              for imp in entry.imports:
                  if not imp.name: continue
                  name=imp.name.decode("ascii","replace")
                  if name.casefold() not in wanted: continue
                  iat=imp.address
                  pattern=b"\xff\x25"+struct.pack("<I",iat)
                  thunks=[]
                  for sec in pe.sections:
                      if not (sec.Characteristics & 0x20000000): continue
                      st,en=sec.PointerToRawData,sec.PointerToRawData+sec.SizeOfRawData
                      pos=st
                      while True:
                          pos=blob.find(pattern,pos,en)
                          if pos<0: break
                          thunks.append(base+sec.VirtualAddress+(pos-st)); pos+=1
                  out.append(f"## {dll}!{name} IAT 0x{iat:08X}")
                  for thunk in sorted(set(thunks)):
                      out.append(f"- thunk 0x{thunk:08X}")
                      refs=[]
                      for sec in pe.sections:
                          if not (sec.Characteristics & 0x20000000): continue
                          raw=blob[sec.PointerToRawData:sec.PointerToRawData+sec.SizeOfRawData]
                          va=base+sec.VirtualAddress
                          for ins in md.disasm(raw,va):
                              if ins.mnemonic in ("call","jmp") and ins.operands and ins.operands[0].type==2 and ins.operands[0].imm==thunk:
                                  refs.append(ins.address)
                      for site in refs: out.append(f"  - direct caller 0x{site:08X}")
          Path("gdiplus-save/import-thunks.md").write_text("\n".join(out)+"\n")
          PY
          for target in 0x0048FF60 0x0048F8C0 0x0048ED8C 0x004A0148; do
            safe=${target#0x}
            python tools/trace_td32_procedure_skipdata.py analysis-input/EmwatMethods.bpl1 "$target" \
              "gdiplus-save/procedure-$safe.md" || true
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 "$target" \
              "gdiplus-save/callers-$safe.md" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emwat-gdiplus-tiff-save-path
          path: gdiplus-save/
          if-no-files-found: error
