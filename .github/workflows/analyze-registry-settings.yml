name: Analyze EMWAT registry settings
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-registry-settings.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/trace_td32_callers.py'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_pe_range.py'
      - 'tools/decode_pe_strings.py'
      - 'tools/scan_pe_pointer_refs.py'
      - 'tools/scan_registry_api_calls.py'
permissions:
  contents: read
jobs:
  registry-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Resolve registry read and write helper callers
        run: |
          mkdir -p registry-analysis/callers
          for target in 004043E4 004043EC 004043F4 0040440C 00404414 0040441C 00404424 0040442C 00404434 0040443C 00404444 0040444C 00404454; do
            python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x$target registry-analysis/callers/$target-callers.md
            python tools/scan_pe_pointer_refs.py analysis-input/EmwatMethods.bpl1 0x$target registry-analysis/callers/$target-pointer-refs.md
          done
      - name: Trace registry constructors and known settings owners
        run: |
          mkdir -p registry-analysis/procedures
          for target in 00466D58 00467CE9 00467C60 00468E0B 00509245 005099C1 005EAA14 005EAA20 005EACDC 005EAD94 005EAE5D 004D0D24; do
            python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x$target registry-analysis/procedures/$target.md
          done
          python tools/find_td32_class_procedures.py analysis-input/EmwatMethods.bpl1 TEmSettingForm TWordViwer TfrmShowAutoSaveFiles > registry-analysis/procedures/registry-owner-class-procedures.md
      - name: Decode unresolved registry value names and bounded contexts
        run: |
          mkdir -p registry-analysis/data
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x00466F3C 0x00466F84 0x00466FAC 0x00467F2C 0x00467F64 0x0050944C 0x00509490 0x005094A8 0x005094C0 0x005094DC 0x00509B34 0x00509B78 0x00509B90 0x00509BA8 0x00509BC4 0x00509BE0 0x00509C00 0x00509C18 0x005EB118 0x005EB160 0x005EB198 0x005EB1D4 0x005EB204 0x005EB22C 0x005EB264 0x005094F8 0x00509518 0x00509530 0x00466D16 0x00468E0B 0x00509245 0x005099C1 0x005EAE5D > registry-analysis/data/registry-value-and-context-strings.md
          for spec in "00466CE0 00466D40" "00467C60 00467CC0" "00468DD0 00468E40" "00509200 00509270" "00509980 005099F0" "005EAE20 005EAE80"; do
            set -- $spec
            python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x$1 0x$2 registry-analysis/data/context-$1.md
          done
      - name: Cross-check registry API inventory
        run: |
          python tools/scan_registry_api_calls.py
          cp word-lifecycle-analysis/registry-api-call-sites.md registry-analysis/registry-api-call-sites.md
      - name: Decode AutoSave interval and logging-level tables
        run: |
          python - <<'PY'
          import pathlib, struct
          import pefile
          path = pathlib.Path("analysis-input/EmwatMethods.bpl1")
          pe = pefile.PE(str(path), fast_load=True)
          base = pe.OPTIONAL_HEADER.ImageBase
          def read_va(va, size):
              off = pe.get_offset_from_rva(va-base)
              return pe.__data__[off:off+size]
          out = ["# Dynamic Config option tables", ""]
          labels_base = struct.unpack("<I", read_va(0x0062A7F4,4))[0]
          out += [f"## Logging-level labels table at 0x{labels_base:08X}", ""]
          for i in range(6):
              ptr = struct.unpack("<I", read_va(labels_base+i*4,4))[0]
              try:
                  refcount, length = struct.unpack("<ii", read_va(ptr-8,8))
                  value = read_va(ptr,length*2).decode("utf-16le","replace")
                  out.append(f"- [{i}] ptr=0x{ptr:08X}, len={length}, ref={refcount}: {value}")
              except Exception as exc:
                  out.append(f"- [{i}] ptr=0x{ptr:08X}: decode failed ({exc})")
          interval_base = struct.unpack("<I", read_va(0x0062A808,4))[0]
          out += ["", f"## AutoSave interval table at 0x{interval_base:08X}", ""]
          for i in range(6):
              value = struct.unpack("<I", read_va(interval_base+i*4,4))[0]
              out.append(f"- [{i}] {value} seconds ({value*1000} ms)")
          pathlib.Path("registry-analysis/data/dynamic-config-option-tables.md").write_text("\n".join(out)+"\n",encoding="utf-8")
          print("\n".join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-registry-settings-analysis
          path: registry-analysis/

