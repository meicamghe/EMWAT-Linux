name: Python bridge transport
on:
  push:
    paths:
      - 'python/**'
      - '.github/workflows/python-bridge.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bridge transport tests
        working-directory: python
        run: |
          python -m pip install --no-deps --no-build-isolation -e .
          python -m unittest discover -s tests -v
