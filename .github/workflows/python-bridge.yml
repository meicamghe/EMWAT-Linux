name: Python bridge transport
on:
  push:
    branches:
      - main
    paths:
      - 'python/**'
      - '.github/workflows/python-bridge.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-bridge.yml'
  workflow_dispatch:

concurrency:
  # Give every commit its own queue group so pending PR runs are not replaced.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        working-directory: python
        run: python -m pip install -r requirements.txt
      - name: Install bridge package and verify console entrypoint
        working-directory: python
        run: |
          python -m pip install --no-deps .
          emwat-linux-doctor --help
          emwat-linux --help
          emwat-linux-desktop-entry --help
      - name: Run bridge transport tests
        working-directory: python
        run: |
          timeout --kill-after=30s 12m python -c 'import faulthandler, unittest; faulthandler.dump_traceback_later(300, repeat=True); suite = unittest.defaultTestLoader.discover("tests"); result = unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())'
