name: Python bridge transport
on:
  push:
    paths:
      - 'python/**'
      - '.github/workflows/python-bridge.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        working-directory: python
        run: python -m pip install -r requirements.txt
      - name: Install bridge package and verify console entrypoint
        working-directory: python
        run: |
          python -m pip install --no-deps .
          emwat-linux-doctor --help
          emwat-linux --help
      - name: Run bridge transport tests
        working-directory: python
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
