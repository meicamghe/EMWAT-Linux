name: Python bridge transport
on:
  push:
    branches:
      - main
    paths:
      - 'python/**'
      - '.github/workflows/python-bridge.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-bridge.yml'
  workflow_dispatch:

concurrency:
  # Give every commit its own queue group so pending PR runs are not replaced.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        working-directory: python
        run: python -m pip install -r requirements.txt
      - name: Install bridge package and verify console entrypoint
        working-directory: python
        run: |
          python -m pip install --no-deps .
          emwat-linux-doctor --help
          emwat-linux --help
          emwat-linux-desktop-entry --help
      - name: Run bridge transport tests
        working-directory: python
        shell: bash
        run: |
          set -o pipefail
          timeout --kill-after=30s 12m python -u - <<'PY' 2>&1 | tee bridge-test.log
          import faulthandler
          import unittest

          faulthandler.dump_traceback_later(300, repeat=True)

          class StreamingResult(unittest.TextTestResult):
              def startTest(self, test):
                  super().startTest(test)
                  self.stream.flush()

              def stopTest(self, test):
                  self.stream.flush()
                  super().stopTest(test)

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(
              verbosity=2,
              resultclass=StreamingResult,
          ).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Upload Python bridge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-bridge-diagnostics-${{ github.run_id }}
          path: python/bridge-test.log
          if-no-files-found: warn
          retention-days: 7
