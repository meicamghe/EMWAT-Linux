name: Analyze EMWAT Invoke receiver
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-invoke-enumerator.yml'
      - 'analysis-input/EmwatMethods.bpl1'
      - 'tools/trace_td32_procedure.py'
      - 'tools/trace_td32_callers.py'
      - 'tools/inspect_pe_va.py'
      - 'tools/inspect_delphi_vmt_address.py'
      - 'tools/analyze_emwat_td32.py'
permissions:
  contents: read
jobs:
  invoke-enumerator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile capstone
      - name: Trace Invoke XML receiver and dictionary helpers
        run: |
          mkdir -p invoke-enumerator-analysis
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0046C82C invoke-enumerator-analysis/TEmwatMethod-Invoke.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0044C238 invoke-enumerator-analysis/TXMLEmwatType-AfterConstruction.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x0044C238 invoke-enumerator-analysis/TXMLEmwatType-AfterConstruction-callers.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0044B468 invoke-enumerator-analysis/TXMLEmwatType-construction-helper-44B468.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0046DE84 invoke-enumerator-analysis/Enumerable-ToArrayImpl.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0046E324 invoke-enumerator-analysis/TPairEnumerator-DoGetCurrent.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x0046E324 invoke-enumerator-analysis/TPairEnumerator-DoGetCurrent-callers.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0046E3CC invoke-enumerator-analysis/TPairList-enumerator-helper.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0046DC8C invoke-enumerator-analysis/TDictionary-AddOrSetValue.md
      - name: Inspect generic enumerator VMTs
        run: |
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x0046AE94 invoke-enumerator-analysis/TEnumerator-TPair-vmt.md
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x0046BEE8 invoke-enumerator-analysis/TPairEnumerator-vmt.md
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x0046C0D4 invoke-enumerator-analysis/TDictionary-vmt.md
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x0046B010 invoke-enumerator-analysis/TEnumerable-TPair-vmt.md
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x0044B9AC invoke-enumerator-analysis/TXMLEmwatType-vmt.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044BA14 --before 0 --after 0x90 > invoke-enumerator-analysis/TXMLEmwatType-class-slots-68-through-CC.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044B8E0 --before 0 --after 0x90 > invoke-enumerator-analysis/TXMLEmwatType-interface-slots-68-through-CC.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0046AEFC --before 0 --after 0x90 > invoke-enumerator-analysis/TEnumerator-TPair-slots-68-through-CC.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0046BF50 --before 0 --after 0x90 > invoke-enumerator-analysis/TPairEnumerator-slots-68-through-CC.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0046C13C --before 0 --after 0x90 > invoke-enumerator-analysis/TDictionary-slots-68-through-CC.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0046B078 --before 0 --after 0x90 > invoke-enumerator-analysis/TEnumerable-TPair-slots-68-through-CC.md
      - name: Inspect XML interface VTable dispatch slots
        run: |
          mkdir -p invoke-enumerator-analysis
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044B8E0 --before 0 --after 0x10 > invoke-enumerator-analysis/TXMLEmwatType-interface-slot-68.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044B928 --before 0 --after 0x30 > invoke-enumerator-analysis/TXMLEmwatType-interface-slots-B0-through-CC.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044BC60 --before 0 --after 0x10 > invoke-enumerator-analysis/TXMLMethodType-interface-slot-68.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044BCA8 --before 0 --after 0x30 > invoke-enumerator-analysis/TXMLMethodType-interface-slots-B0-through-CC.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044BA5C --before 0 --after 0x70 > invoke-enumerator-analysis/TXMLEmwatType-class-vmt-near-B0.md
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x0044BD48 invoke-enumerator-analysis/TXMLMethodType-vmt.md
          python tools/inspect_delphi_vmt_address.py analysis-input/EmwatMethods.bpl1 0x0044C08C invoke-enumerator-analysis/TXMLParamType-vmt.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044BDB0 --before 0 --after 0x90 > invoke-enumerator-analysis/TXMLMethodType-class-slots-68-through-CC.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044C0F4 --before 0 --after 0x90 > invoke-enumerator-analysis/TXMLParamType-class-slots-68-through-CC.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044BFC4 --before 0 --after 0x90 > invoke-enumerator-analysis/TXMLParamType-interface-slots-68-through-CC.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044C00C --before 0 --after 0x30 > invoke-enumerator-analysis/TXMLParamType-interface-slots-B0-through-CC.md
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044BA5C invoke-enumerator-analysis/TXMLEmwatType-class-slot-B0.md 120 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044BA78 invoke-enumerator-analysis/TXMLEmwatType-class-slot-CC.md 120 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044BDF8 invoke-enumerator-analysis/TXMLMethodType-class-slot-B0.md 120 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044BE14 invoke-enumerator-analysis/TXMLMethodType-class-slot-CC.md 120 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044C13C invoke-enumerator-analysis/TXMLParamType-class-slot-B0.md 120 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044C158 invoke-enumerator-analysis/TXMLParamType-class-slot-CC.md 120 ret
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x0044BC60 0x0044BC78 invoke-enumerator-analysis/TXMLMethodType-interface-slot-68-code.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x0044BCA8 0x0044BCD0 invoke-enumerator-analysis/TXMLMethodType-interface-slots-B0-CC-code.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x0044BFC4 0x0044BFDC invoke-enumerator-analysis/TXMLParamType-interface-slot-68-code.md
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x0044C00C 0x0044C034 invoke-enumerator-analysis/TXMLParamType-interface-slots-B0-CC-code.md
      - name: Trace XML interface implementation thunks
        run: |
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044B709 invoke-enumerator-analysis/TXMLEmwatType-interface-B0-thunk.md 48 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044BA61 invoke-enumerator-analysis/TXMLMethodType-interface-CC-thunk.md 48 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044B7D1 invoke-enumerator-analysis/TXMLEmwatType-interface-68-thunk.md 48 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044BB51 invoke-enumerator-analysis/TXMLMethodType-interface-68-thunk.md 48 ret
      - name: Resolve TXMLParamType interface key/value slots
        run: |
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044BDF5 invoke-enumerator-analysis/TXMLParamType-interface-B0-thunk.md 48 ret
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044BEB5 invoke-enumerator-analysis/TXMLParamType-interface-68-thunk.md 48 ret
      - name: Identify TXMLParamType key attribute
        run: |
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044B4C0 invoke-enumerator-analysis/TXMLParamType-key-attribute-helper.md 48 ret
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x0044C95C > invoke-enumerator-analysis/TXMLParamType-key-attribute-name.md
      - name: Trace TXMLParamType setter implementations
        run: |
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0044C8E4 invoke-enumerator-analysis/TXMLParamType-interface-B0-implementation.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x0044C8E4 invoke-enumerator-analysis/TXMLParamType-interface-B0-implementation-callers.md
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044B568 invoke-enumerator-analysis/TXMLParamType-interface-68-implementation.md 48 ret
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x0044B568 0x0044B5A8 invoke-enumerator-analysis/XML-interface-slot-68-shared-body.md
      - name: Trace resolved XML interface method implementations
        run: |
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0044C458 invoke-enumerator-analysis/TXMLEmwatType-interface-B0-implementation.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x0044C458 invoke-enumerator-analysis/TXMLEmwatType-interface-B0-implementation-callers.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0044C754 invoke-enumerator-analysis/TXMLMethodType-interface-CC-implementation.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x0044C754 invoke-enumerator-analysis/TXMLMethodType-interface-CC-implementation-callers.md
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044BA59 invoke-enumerator-analysis/TXMLMethodType-interface-C8-thunk.md 48 ret
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x0044BA59 0x0044BA69 invoke-enumerator-analysis/TXMLMethodType-interface-C8-CC-thunks.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0044C62C invoke-enumerator-analysis/TXMLMethodType-interface-C8-implementation.md
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044C62C invoke-enumerator-analysis/TXMLMethodType-interface-C8-implementation-body.md 160 ret
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x0044C62C invoke-enumerator-analysis/TXMLMethodType-interface-C8-implementation-callers.md
          python tools/inspect_pe_va.py analysis-input/EmwatMethods.bpl1 0x0044B8CC --before 0 --after 0x10 > invoke-enumerator-analysis/TXMLEmwatType-interface-slot-54.md
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x0044C6A4 0x0044C4EC 0x0044C2C0 > invoke-enumerator-analysis/TXMLMethodType-method-attribute-and-tag-strings.md
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044B7A9 invoke-enumerator-analysis/TXMLEmwatType-interface-slot-54-thunk.md 48 ret
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x0044B7A9 0x0044B7B1 invoke-enumerator-analysis/TXMLEmwatType-interface-slot-54-thunk-code.md
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0044B568 invoke-enumerator-analysis/XML-interface-slot-68-shared-implementation.md
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x0044B568 invoke-enumerator-analysis/XML-interface-slot-68-shared-implementation-callers.md
      - name: Re-run method attribute and serializer probes with explicit outputs
        run: |
          python tools/decode_pe_strings.py analysis-input/EmwatMethods.bpl1 0x0044C6A4 0x0044C4EC 0x0044C2C0 > invoke-enumerator-analysis/TXMLMethodType-method-attribute-and-tag-strings.md
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044B7A9 invoke-enumerator-analysis/TXMLEmwatType-interface-slot-54-thunk.md 48 ret
          python tools/trace_pe_range.py analysis-input/EmwatMethods.bpl1 0x0044B7A9 0x0044B7B1 invoke-enumerator-analysis/TXMLEmwatType-interface-slot-54-thunk-code.md
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044C62C invoke-enumerator-analysis/TXMLMethodType-interface-C8-implementation-body.md 160 ret
      - name: Trace XML serializer getter implementation
        run: |
          python tools/trace_td32_procedure.py analysis-input/EmwatMethods.bpl1 0x0044B590 invoke-enumerator-analysis/TXMLEmwatType-serializer-getter-implementation.md
          python tools/trace_pe_target.py analysis-input/EmwatMethods.bpl1 0x0044B590 invoke-enumerator-analysis/TXMLEmwatType-serializer-getter-body.md 160 ret
          python tools/trace_td32_callers.py analysis-input/EmwatMethods.bpl1 0x0044B590 invoke-enumerator-analysis/TXMLEmwatType-serializer-getter-callers.md
      - uses: actions/upload-artifact@v4
        with:
          name: emwat-invoke-receiver-analysis
          path: invoke-enumerator-analysis/
