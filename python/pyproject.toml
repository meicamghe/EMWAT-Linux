[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emwat-linux-bridge"
version = "0.1.0"
description = "Native Linux loopback transport foundation for EMWAT"
requires-python = ">=3.10"

[project.optional-dependencies]
recovery-encryption = ["cryptography>=42,<47"]
recovery-keyring = ["keyring>=25,<27"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
