[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emwat-linux-bridge"
version = "0.1.0"
description = "Native Linux loopback transport foundation for EMWAT"
requires-python = ">=3.10"

[project.scripts]
emwat-linux-doctor = "emwat_linux.doctor:main"
emwat-linux = "emwat_linux.gtk_desktop:main"
emwat-linux-desktop-entry = "emwat_linux.desktop_entry:main"

[project.optional-dependencies]
recovery-encryption = ["cryptography>=42,<47"]
recovery-keyring = ["keyring>=25,<27"]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
